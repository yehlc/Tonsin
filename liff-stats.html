<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>缺失統計報表</title> 
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--primary:#1A6FA8;--primary-light:#dceffe;--green:#1D7C4D;--red:#e74c3c;--orange:#ff9800;--text:#1A2F4B;--muted:#888;--bg:#f0f4f8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'PingFang TC','Noto Sans TC',sans-serif;background:var(--bg);min-height:100vh;}
.header{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.header h1{font-size:16px;font-weight:700;flex:1;}
.filters{background:#fff;padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #ddd;}
.filter-row{display:flex;gap:8px;align-items:center;}
.filter-row label{font-size:12px;color:var(--muted);width:50px;flex-shrink:0;}
.filter-row select,.filter-row input{flex:1;padding:7px;border:1px solid #ddd;border-radius:6px;font-size:13px;}
.btn-load{padding:9px 18px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;}
.scard{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.scard .num{font-size:24px;font-weight:700;}
.scard .lbl{font-size:10px;color:var(--muted);margin-top:3px;}
.chart-wrap{background:#fff;border-radius:10px;margin:0 10px 10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.chart-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #eee;}
canvas{max-height:220px;}
.tab-btns{display:flex;gap:6px;margin-bottom:10px;}
.tab-btn{flex:1;padding:7px;border:1px solid #ddd;border-radius:20px;font-size:12px;cursor:pointer;text-align:center;color:var(--muted);background:#fff;}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
#globalLoader{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:999;font-size:24px;}
.rate-bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;}
.rate-bar .bar-bg{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden;}
.rate-bar .bar-fg{height:100%;border-radius:4px;}
</style>
</head>
<body>
<div id="globalLoader">⏳</div>
<div class="header">
  <span style="font-size:20px;">📊</span>
  <h1>缺失統計報表</h1>
</div>

<div class="filters">
  <div class="filter-row">
    <label>案場</label>
    <select id="fSite" onchange="loadFloors()"><option value="ALL">全部案場</option></select>
    <select id="fFloor"><option value="">全部樓層</option></select>
  </div>
  <div class="filter-row">
    <label>從</label>
    <input type="date" id="fDateFrom">
    <label style="text-align:center;width:20px;">至</label>
    <input type="date" id="fDateTo">
  </div>
  <div class="filter-row" style="justify-content:flex-end;">
    <button class="btn-load" onclick="loadStats()">📊 載入統計</button>
  </div>
</div>

<div id="statsContent" style="padding-bottom:20px;">
  <div style="text-align:center;padding:40px;color:var(--muted);">請選擇篩選條件後點選「載入統計」</div>
</div>

<script>
const LIFF_ID  = "2009287087-4LSCRAq4";
const urlP     = new URLSearchParams(window.location.search);
const apiBase  = urlP.get('api') || 'https://carmen-italic-tomatoes-digit.trycloudflare.com';
let lineId='', myUserId=urlP.get('userId')||'';
const SITE_LIST = ["98工地","99工地","95工地","鼎隆大苑","毅聯R8","毅聯寧夏","廣宇江南","內湖富樂群","中壢映象","測試工地"];
let chartDept=null, chartFloor=null, chartTrend=null, chartStatus=null;

// 預設日期：最近3個月
const today=new Date();
const threeMonthsAgo=new Date(today); threeMonthsAgo.setMonth(threeMonthsAgo.getMonth()-3);
document.getElementById('fDateFrom').value = threeMonthsAgo.toISOString().split('T')[0];
document.getElementById('fDateTo').value   = today.toISOString().split('T')[0];

liff.init({ liffId:LIFF_ID }).then(async () => {
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }
  const p = await liff.getProfile();
  lineId = p.userId;
  try {
    const r = await fetch(apiBase+'/check-auth?userId='+lineId, { headers:{'ngrok-skip-browser-warning':'true'} });
    const info = await r.json();
    // 填入有權限的案場
    const fSite = document.getElementById('fSite');
    const sites = (info.assignedSites||[]).includes('ALL') ? SITE_LIST : (info.assignedSites||[]);
    sites.forEach(s => { const o=document.createElement('option'); o.value=s; o.textContent=s; fSite.appendChild(o); });
  } catch(e){}
  document.getElementById('globalLoader').style.display='none';
}).catch(()=>{ document.getElementById('globalLoader').style.display='none'; });

async function loadFloors() {
  const site = document.getElementById('fSite').value;
  const sel  = document.getElementById('fFloor');
  sel.innerHTML = '<option value="">全部樓層</option>';
  if (site === 'ALL') return;
  try {
    const r = await fetch(`${apiBase}/query?site=${encodeURIComponent(site)}&floor=&status=`, { headers:{'ngrok-skip-browser-warning':'true'} });
    const data = await r.json();
    const floors = [...new Set((data||[]).map(d=>d.Floor).filter(Boolean))].sort();
    floors.forEach(f => { const o=document.createElement('option'); o.value=f; o.textContent=f; sel.appendChild(o); });
  } catch(e){}
}

async function loadStats() {
  const site  = document.getElementById('fSite').value;
  const floor = document.getElementById('fFloor').value;
  const df    = document.getElementById('fDateFrom').value;
  const dt    = document.getElementById('fDateTo').value;

  document.getElementById('statsContent').innerHTML = '<div style="text-align:center;padding:40px;font-size:20px;">⏳</div>';

  try {
    const r = await fetch(`${apiBase}/stats/defects?userId=${lineId||myUserId}&site=${encodeURIComponent(site)}&floor=${encodeURIComponent(floor)}&dateFrom=${df}&dateTo=${dt}`,
      { headers:{'ngrok-skip-browser-warning':'true'} });
    const res = await r.json();
    if (!res.success) throw new Error(res.error);
    renderStats(res);
  } catch(e) {
    document.getElementById('statsContent').innerHTML = `<div style="text-align:center;padding:40px;color:#e74c3c;">❌ ${e.message}</div>`;
  }
}

function renderStats(data) {
  const s = data.summary || { Total:0, Pending:0, Review:0, Fixed:0 };
  const fixRate = s.Total > 0 ? Math.round(s.Fixed/s.Total*100) : 0;

  const html = `
    <div class="summary-cards">
      <div class="scard"><div class="num" style="color:#1A6FA8;">${s.Total}</div><div class="lbl">總缺失數</div></div>
      <div class="scard"><div class="num" style="color:#e74c3c;">${s.Pending}</div><div class="lbl">待改善</div></div>
      <div class="scard"><div class="num" style="color:#ff9800;">${s.Review}</div><div class="lbl">待驗收</div></div>
      <div class="scard"><div class="num" style="color:#1D7C4D;">${s.Fixed}</div><div class="lbl">已改善</div></div>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">📈 修繕進度</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="font-size:24px;font-weight:700;color:var(--green);">${fixRate}%</div>
        <div style="flex:1;height:12px;background:#eee;border-radius:6px;overflow:hidden;">
          <div style="height:100%;width:${fixRate}%;background:linear-gradient(90deg,#1D7C4D,#27ae60);border-radius:6px;transition:width 1s;"></div>
        </div>
      </div>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">🔧 依工種分布</div>
      <canvas id="chartDept"></canvas>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">🏢 依樓層分布</div>
      <canvas id="chartFloor"></canvas>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">📅 每月趨勢</div>
      <canvas id="chartTrend"></canvas>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">🔧 各工種修繕率</div>
      <div id="deptRates"></div>
    </div>`;

  document.getElementById('statsContent').innerHTML = html;

  // ── 工種長條圖 ──
  const deptMap = {};
  (data.byDept||[]).forEach(d => {
    if (!deptMap[d.Dept]) deptMap[d.Dept] = { 待改善:0, 待驗收:0, 已改善:0 };
    if (d.Status.includes('待改善')) deptMap[d.Dept]['待改善'] += d.Count;
    else if (d.Status.includes('待驗收')) deptMap[d.Dept]['待驗收'] += d.Count;
    else if (d.Status.includes('已改善')) deptMap[d.Dept]['已改善'] += d.Count;
  });
  const depts = Object.keys(deptMap);
  if (depts.length > 0) {
    new Chart(document.getElementById('chartDept'), {
      type: 'bar',
      data: {
        labels: depts.map(d => d.length>6?d.substring(0,6)+'…':d),
        datasets: [
          { label:'待改善', data: depts.map(d=>deptMap[d]['待改善']), backgroundColor:'#e74c3c' },
          { label:'待驗收', data: depts.map(d=>deptMap[d]['待驗收']), backgroundColor:'#ff9800' },
          { label:'已改善', data: depts.map(d=>deptMap[d]['已改善']), backgroundColor:'#1D7C4D' }
        ]
      },
      options: { responsive:true, scales:{ x:{ stacked:true }, y:{ stacked:true, beginAtZero:true } } }
    });

    // 工種修繕率
    const ratesHtml = depts.sort((a,b)=>{
      const tot = v => deptMap[v]['待改善']+deptMap[v]['待驗收']+deptMap[v]['已改善'];
      return tot(b)-tot(a);
    }).map(d => {
      const t = deptMap[d]['待改善']+deptMap[d]['待驗收']+deptMap[d]['已改善'];
      const pct = t>0 ? Math.round(deptMap[d]['已改善']/t*100) : 0;
      return `<div class="rate-bar">
        <span style="width:70px;font-size:11px;color:var(--text);">${d.length>5?d.substring(0,5)+'…':d}</span>
        <div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:#1D7C4D;"></div></div>
        <span style="font-size:11px;color:var(--muted);width:35px;">${pct}%</span>
      </div>`;
    }).join('');
    document.getElementById('deptRates').innerHTML = ratesHtml;
  }

  // ── 樓層圖 ──
  const floorMap = {};
  (data.byFloor||[]).forEach(d => {
    if (!floorMap[d.Floor]) floorMap[d.Floor] = 0;
    floorMap[d.Floor] += d.Count;
  });
  const floors = Object.keys(floorMap).sort();
  if (floors.length > 0) {
    new Chart(document.getElementById('chartFloor'), {
      type: 'bar',
      data: {
        labels: floors,
        datasets: [{ label:'缺失數', data: floors.map(f=>floorMap[f]),
          backgroundColor:'rgba(26,111,168,.7)', borderColor:'#1A6FA8', borderWidth:1 }]
      },
      options: { responsive:true, scales:{ y:{ beginAtZero:true } } }
    });
  }

  // ── 月趨勢 ──
  const months = (data.byMonth||[]).map(m=>m.Month);
  if (months.length > 0) {
    new Chart(document.getElementById('chartTrend'), {
      type: 'line',
      data: {
        labels: months,
        datasets: [
          { label:'新增', data:(data.byMonth||[]).map(m=>m.Total), borderColor:'#1A6FA8', tension:.4, fill:false },
          { label:'已改善', data:(data.byMonth||[]).map(m=>m.Fixed), borderColor:'#1D7C4D', tension:.4, fill:false }
        ]
      },
      options: { responsive:true, scales:{ y:{ beginAtZero:true } } }
    });
  }
}
</script>
</body>
</html>
