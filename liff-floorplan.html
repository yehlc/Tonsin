<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>同興營造 — 現場缺失管理</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --orange:#f39c12;--red:#e74c3c;--green:#27ae60;
  --blue:#2980b9;--gray:#7f8c8d;--dark:#2c3e50;
  --bg:#f4f4f4;--card:#fff;--border:#ddd;
  --shadow:0 2px 10px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:var(--dark)}

/* ── Header ── */
.header{background:var(--orange);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:300;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;opacity:.85;margin-top:2px}

/* ── Tabs ── */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:54px;z-index:200}
.tab{flex:1;text-align:center;padding:11px 2px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.tab.active{color:var(--orange);border-color:var(--orange)}

/* ── Selector Bar ── */
.sel-bar{display:flex;gap:7px;padding:9px 11px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sel-bar select{flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;background:#f8f9fa;appearance:none;font-weight:600}
.icon-btn{padding:8px 11px;background:var(--orange);color:#fff;border:none;border-radius:7px;font-size:14px;cursor:pointer;white-space:nowrap}
.icon-btn.green{background:var(--green)}
.icon-btn.blue{background:var(--blue)}

/* ── Export row ── */
.export-row{display:flex;gap:7px;padding:8px 11px;background:#f8f9fa;border-bottom:1px solid var(--border)}
.export-row button{flex:1;padding:8px 6px;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn-exp-all  {background:#1e8449;color:#fff}
.btn-exp-trade{background:#1a5276;color:#fff}
.btn-exp-all:active,.btn-exp-trade:active{opacity:.8}

/* ── Map ── */
#mapPage{display:none}
.map-hint{background:rgba(255,234,167,.92);color:#c0392b;text-align:center;padding:9px;font-size:13px;font-weight:700}
.map-hint.ready{background:rgba(39,174,96,.1);color:#1e8449}
.canvas-wrap{position:relative;width:100%;overflow:auto;background:#999;-webkit-overflow-scrolling:touch}
canvas{display:block;min-width:100%;cursor:crosshair}

/* ── Zoom bar ── */
.zoom-bar{display:flex;gap:0;background:#2c3e50}
.zoom-btn{flex:1;padding:9px;font-size:18px;font-weight:700;color:#fff;background:none;border:none;cursor:pointer;border-right:1px solid rgba(255,255,255,.15)}
.zoom-btn:last-child{border:none}

/* ── FAB ── */
.fab{position:fixed;bottom:22px;right:14px;width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(243,156,18,.55);cursor:pointer;z-index:250;display:flex;align-items:center;justify-content:center;transition:.2s}
.fab:active{transform:scale(.92)}

/* ── Sheet ── */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:500;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 8px}
.sheet-title{font-size:15px;font-weight:700;padding:0 15px 10px;border-bottom:1px solid var(--border)}
.sheet-body{padding:13px 15px}

/* ── Form ── */
.fg{margin-bottom:12px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--gray);margin-bottom:5px}
.req{color:var(--red)}
select.ff,textarea.ff{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:#f8f9fa;appearance:none}
select.ff:focus,textarea.ff:focus{border-color:var(--orange);background:#fff;outline:none}
textarea.ff{height:72px;resize:none}

.pin-info{background:#fff8ec;border:1.5px solid var(--orange);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;margin-bottom:11px;display:none}
.pin-warn{background:#fdecea;border:1.5px solid var(--red);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--red);font-weight:700;margin-bottom:11px}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{padding:6px 12px;border-radius:13px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:.15s}
.chip.active{border-color:var(--orange);background:#fff8ec;color:var(--orange)}

.photo-zone{border:2px dashed var(--border);border-radius:9px;padding:15px;text-align:center;position:relative;background:#fafafa;cursor:pointer}
.photo-zone:active{border-color:var(--orange);background:#fff8ec}
.photo-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph-icon{font-size:26px;margin-bottom:4px}
.ph-text{font-size:12px;color:var(--gray)}
#photoPreview{width:100%;border-radius:7px;margin-top:7px;display:none;max-height:180px;object-fit:cover}

.btn-submit{width:100%;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 3px 10px rgba(243,156,18,.4)}
.btn-submit:disabled{background:#b2bec3;box-shadow:none}
.btn-cancel{width:100%;padding:11px;background:#f0f0f0;color:var(--gray);border:none;border-radius:9px;font-size:14px;cursor:pointer;margin-top:7px}

/* ── Detail card ── */
.detail-card{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:500;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;display:none}
.detail-card.open{display:block;transform:translateY(0)}
.detail-img-wrap{width:100%;max-height:200px;overflow:hidden;background:#111;display:none}
.detail-img{width:100%;max-height:200px;object-fit:cover}
.detail-body{padding:13px 15px}
.d-status{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:9px}
.d-todo{background:#fdecea;color:var(--red)}
.d-review{background:#e3f2fd;color:var(--blue)}
.d-done{background:#e8f8ee;color:var(--green)}
.d-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.d-meta{font-size:12px;color:var(--gray);line-height:1.9}
.act-row{display:flex;gap:7px;margin-top:11px}
.act-btn{flex:1;padding:11px 5px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.a-orange{background:var(--orange);color:#fff}
.a-green{background:var(--green);color:#fff}
.a-red{background:var(--red);color:#fff}
.a-gray{background:#f0f0f0;color:var(--gray)}

.edit-row{display:flex;gap:7px;align-items:center;margin-top:10px}
.edit-row input{flex:1;padding:8px;border:1.5px solid var(--orange);border-radius:6px;font-size:13px}
.edit-row button{padding:8px 12px;background:var(--orange);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}

.fix-photo-wrap{margin-top:11px}

/* ── List page ── */
#listPage{display:none;padding:11px}
.filter-row{display:flex;gap:6px;margin-bottom:9px;overflow-x:auto;padding-bottom:3px}
.filter-chip{padding:5px 13px;border-radius:13px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;white-space:nowrap}
.filter-chip.active{border-color:var(--orange);background:#fff8ec;color:var(--orange)}
.dc{background:#fff;border-radius:9px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden;border-left:4px solid var(--border);cursor:pointer}
.dc.todo{border-color:var(--red)}.dc.review{border-color:var(--blue)}.dc.done{border-color:var(--green)}
.dc-hd{display:flex;justify-content:space-between;padding:9px 11px;align-items:flex-start}
.dc-title{font-weight:700;font-size:14px;flex:1;margin-right:6px;line-height:1.4}
.dc-st{font-size:11px;font-weight:700;padding:3px 6px;border-radius:5px;white-space:nowrap}
.dc-meta{padding:0 11px 9px;font-size:12px;color:var(--gray);line-height:1.8}

/* ── Offline bar ── */
.offline-bar{background:#c0392b;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;display:none;cursor:pointer}

/* ── Toast ── */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(0,0,0,.82);color:#fff;padding:11px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;transition:transform .25s;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── Loader ── */
#loader{position:fixed;inset:0;background:rgba(244,244,244,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #ddd;border-top-color:var(--orange);animation:spin .8s linear infinite;margin-bottom:13px}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-size:14px;color:var(--gray);font-weight:600}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p>現場缺失系統載入中...</p></div>

<div class="offline-bar" id="offlineBar" onclick="syncOffline()">
  📵 離線模式：<span id="offlineCount">0</span> 筆待同步，點擊立即同步
</div>

<div class="header">
  <div>
    <div class="header-title">🗺️ 現場缺失管理</div>
    <div class="header-sub" id="headerSub">同興營造</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tabMap"  onclick="switchTab('map')">🗺️ 圖紙標記</div>
  <div class="tab"        id="tabList" onclick="switchTab('list')">📋 缺失清單</div>
</div>

<!-- 選擇案場/樓層 -->
<div class="sel-bar">
  <select id="selSite" onchange="onSiteChange()"><option value="">— 案場 —</option></select>
  <select id="selFloor" onchange="onFloorChange()" disabled><option value="">— 樓層 —</option></select>
  <button class="icon-btn" onclick="loadDefects()">🔄</button>
</div>

<!-- 匯出列 -->
<div class="export-row" id="exportRow" style="display:none">
  <button class="btn-exp-all"   onclick="exportExcel('all')">📊 匯出總缺失單</button>
  <button class="btn-exp-trade" onclick="exportExcel('trade')">📋 匯出派工單</button>
</div>

<!-- ═══ MAP TAB ═══ -->
<div id="mapPage">
  <div class="map-hint" id="mapHint">請選擇案場與樓層後點擊圖紙標記缺失位置</div>
  <div class="zoom-bar">
    <button class="zoom-btn" onclick="zoomMap(1.3)">＋</button>
    <button class="zoom-btn" onclick="zoomMap(0.77)">－</button>
    <button class="zoom-btn" onclick="zoomMap(1)">⊡ 重置</button>
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="floorCanvas"></canvas>
  </div>
</div>

<!-- ═══ LIST TAB ═══ -->
<div id="listPage">
  <div class="filter-row">
    <div class="filter-chip active" onclick="filterList('ALL',this)">全部</div>
    <div class="filter-chip" onclick="filterList('待改善',this)">🔴 待改善</div>
    <div class="filter-chip" onclick="filterList('待驗收',this)">🔵 待驗收</div>
    <div class="filter-chip" onclick="filterList('已改善',this)">🟢 已改善</div>
  </div>
  <div id="defectList"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabAdd" onclick="startAddMode()">＋</button>

<!-- Sheet mask -->
<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>

<!-- New/Edit sheet -->
<div class="sheet" id="defectSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle">📍 新增缺失</div>
  <div class="sheet-body">
    <input type="hidden" id="editDefectId">
    <input type="hidden" id="pinX"><input type="hidden" id="pinY">

    <div class="pin-info" id="pinInfo">📌 已標記位置：<span id="pinCoordText"></span></div>
    <div class="pin-warn" id="pinWarn">⚠️ 請先在圖紙上點選缺失位置，再填寫資料</div>

    <div class="fg">
      <label class="fl">工程類別 <span class="req">*</span></label>
      <div class="chip-row" id="deptChips"></div>
    </div>
    <div class="fg">
      <label class="fl">缺失說明 <span class="req">*</span></label>
      <textarea class="ff" id="defectDesc" placeholder="請描述缺失狀況..."></textarea>
    </div>
    <div class="fg">
      <label class="fl">現場照片</label>
      <div class="photo-zone">
        <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="onPhotoSelected(this)">
        <div class="ph-icon">📷</div>
        <div class="ph-text">點擊拍攝現場照片</div>
      </div>
      <img id="photoPreview">
    </div>

    <button class="btn-submit" id="btnSubmitDefect" onclick="submitDefect()">📤 送出缺失紀錄</button>
    <button class="btn-cancel" onclick="closeSheet()">取消</button>
  </div>
</div>

<!-- Detail card -->
<div class="sheet-mask" id="detailMask" onclick="closeDetail()" style="display:none"></div>
<div class="detail-card" id="detailCard">
  <div class="sheet-handle"></div>
  <div class="detail-img-wrap" id="detailImgWrap"><img id="detailImg" class="detail-img"></div>
  <div class="detail-body">
    <div class="d-status" id="detailStatus"></div>
    <div class="d-title"  id="detailTitle"></div>
    <div class="d-meta"   id="detailMeta"></div>

    <div class="edit-row" style="margin-top:12px;">
      <input type="text" id="editDescInput" placeholder="修改說明...">
      <button onclick="saveDesc()">儲存</button>
    </div>

    <div class="fix-photo-wrap" id="fixPhotoWrap" style="display:none">
      <label class="fl" style="margin-top:12px;">上傳改善照片</label>
      <div class="photo-zone">
        <input type="file" id="fixPhotoInput" accept="image/*" capture="environment" onchange="onFixPhotoSelected(this)">
        <div class="ph-icon">📷</div><div class="ph-text">拍攝改善後照片</div>
      </div>
      <img id="fixPhotoPreview" style="display:none;width:100%;border-radius:7px;margin-top:7px;max-height:140px;object-fit:cover">
    </div>

    <div class="act-row" id="actionRow"></div>
    <button class="btn-cancel" style="margin-top:9px;" onclick="closeDetail()">關閉</button>
  </div>
</div>

<div id="toast"></div>

/* ─── IndexedDB ─── */
function openDB(){return new Promise((r,j)=>{const q=indexedDB.open('TonsinOff',1);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('q'))e.target.result.createObjectStore('q',{keyPath:'id',autoIncrement:true})};q.onsuccess=e=>{db=e.target.result;r(db)};q.onerror=()=>j(q.error)})}
function addQ(p){return new Promise((r,j)=>{const tx=db.transaction('q','readwrite');const q=tx.objectStore('q').add({p,ts:Date.now()});q.onsuccess=()=>r(q.result);q.onerror=()=>j()})}
function getAllQ(){return new Promise((r,j)=>{const tx=db.transaction('q','readonly');const q=tx.objectStore('q').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j([])})}
function delQ(id){return new Promise(r=>{const tx=db.transaction('q','readwrite');tx.objectStore('q').delete(id).onsuccess=r})}

/* ─── Floor Plan ─── */
function getImageUrl(site,floor){
  const m=FLOOR_IMAGE_MAP[site];
  if(m&&m[floor])return GH_PAGES+m[floor];
  // Fallback para outros工地
  return `${GH_PAGES}/${encodeURIComponent(site)}/${encodeURIComponent(floor)}.png`;
}

function loadFloorPlan(){
  const hint=document.getElementById('mapHint');
  canvas.style.transform='none';currentZoom=1;

  if(NO_MAP.includes(currentFloor)){
    canvas.width=600;canvas.height=300;
    ctx.fillStyle='#e0e0e0';ctx.fillRect(0,0,600,300);
    ctx.fillStyle='#888';ctx.font='16px sans-serif';ctx.textAlign='center';
    ctx.fillText('此樓層無平面圖紙',300,150);
    hint.textContent='⚠️ 此樓層無平面圖紙，仍可新增缺失（不標記位置）';
    hint.className='map-hint';drawDefects(allDefects);return;
  }

  hint.textContent='⏳ 載入圖紙中...';hint.className='map-hint';
  floorImg=new Image();floorImg.crossOrigin='anonymous';
  floorImg.onload=()=>{
    canvas.width=floorImg.naturalWidth;canvas.height=floorImg.naturalHeight;
    ctx.drawImage(floorImg,0,0);drawDefects(allDefects);
    hint.textContent='📌 點擊圖面標記缺失位置，或點擊已有標記查看詳情';
    hint.className='map-hint ready';
  };
  floorImg.onerror=()=>{
    canvas.width=600;canvas.height=400;
    ctx.fillStyle='#e0e0e0';ctx.fillRect(0,0,600,400);
    ctx.fillStyle='#666';ctx.font='16px sans-serif';ctx.textAlign='center';
    ctx.fillText('圖紙尚未上傳：'+currentFloor,300,200);
    hint.textContent='⚠️ 圖紙尚未上傳，點擊任意位置仍可新增缺失';
    hint.className='map-hint';drawDefects(allDefects);
  };
  floorImg.src=getImageUrl(currentSite,currentFloor);
}

function redrawCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(floorImg.complete&&floorImg.naturalWidth>0)ctx.drawImage(floorImg,0,0);
  drawDefects(allDefects);
}

function drawDefects(defects){
  defects.forEach(d=>{
    if(!d.XY_Coord||d.XY_Coord==='略過')return;
    const m=d.XY_Coord.match(/X:([\d.]+)%,\s*Y:([\d.]+)%/);
    if(!m)return;
    const px=parseFloat(m[1])/100*canvas.width, py=parseFloat(m[2])/100*canvas.height;
    const color=d.Status.includes('待改善')?'#e74c3c':d.Status.includes('待驗收')?'#2980b9':'#27ae60';
    drawPin(px,py,d.ID,color);
  });
}

function drawPin(px,py,id,color){
  const r=Math.max(12,canvas.width*0.018);
  ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`bold ${r}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(String(id).slice(-2),px,py);
}

function drawPendingPin(px,py){
  redrawCanvas();
  const r=Math.max(12,canvas.width*0.018);
  ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle='rgba(243,156,18,.85)';ctx.fill();
  ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`bold ${r}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('＋',px,py);
}

/* ─── Canvas interaction ─── */
function getPos(e){
  const r=canvas.getBoundingClientRect(),sx=canvas.width/(r.width*currentZoom),sy=canvas.height/(r.height*currentZoom);
  const src=e.touches?e.changedTouches[0]:e;
  return{x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy};
}
function onCanvasClick(e){tap(getPos(e));}
function onCanvasTouch(e){e.preventDefault();tap(getPos(e));}
function tap(pos){
  if(!currentSite||!currentFloor){showToast('⚠️ 請先選擇案場與樓層');return;}
  const hit=allDefects.find(d=>{
    if(!d.XY_Coord||d.XY_Coord==='略過')return false;
    const m=d.XY_Coord.match(/X:([\d.]+)%,\s*Y:([\d.]+)%/);if(!m)return false;
    const dpx=parseFloat(m[1])/100*canvas.width,dpy=parseFloat(m[2])/100*canvas.height;
    return Math.sqrt((pos.x-dpx)**2+(pos.y-dpy)**2)<Math.max(14,canvas.width*0.022);
  });
  if(hit){openDetail(hit);return;}
  pendingX=(pos.x/canvas.width*100).toFixed(1);pendingY=(pos.y/canvas.height*100).toFixed(1);hasPendingPin=true;
  drawPendingPin(pos.x,pos.y);openSheet();
}

/* ─── Submit ─── */
async function submitDefect(){
  if(!selectedDept){showToast('⚠️ 請選擇工程類別');return;}
  const desc=document.getElementById('defectDesc').value.trim();
  if(!desc){showToast('⚠️ 請填寫缺失說明');return;}
  const xyCoord=hasPendingPin?`[座標] X:${pendingX}%, Y:${pendingY}%`:'略過';
  const btn=document.getElementById('btnSubmitDefect');btn.disabled=true;btn.textContent='⏳ 送出中...';
  const payload={userId:lineId||myUserId,userName:myUser||'現場人員',site:currentSite,floor:currentFloor,dept:selectedDept,description:desc,xyCoord,status:'🔴 待改善',imageBase64:photoBase64?photoBase64.replace(/^data:image\/\w+;base64,/,''):null};
  if(!isOnline){await addQ({type:'add',...payload});checkQ();showToast('📵 已存入離線佇列，上線後同步');closeSheet();btn.disabled=false;btn.textContent='📤 送出缺失紀錄';return;}
  try{
    const r=await apiFetch('/add',{method:'POST',body:JSON.stringify(payload)});
    const res=await r.json();
    if(res.success){showToast('✅ #'+res.newId+' 缺失已建立！繼續標記下一筆...');closeSheet();await loadDefects();document.getElementById('mapHint').textContent='📌 可繼續點選圖紙新增下一筆缺失';document.getElementById('mapHint').className='map-hint ready';}
    else showToast('❌ 送出失敗：'+(res.error||'伺服器錯誤'));
  }catch(e){showToast('❌ 連線異常，存入離線佇列');await addQ({type:'add',...payload});checkQ();closeSheet();}
  finally{btn.disabled=false;btn.textContent='📤 送出缺失紀錄';hasPendingPin=false;photoBase64=null;}
}

/* ─── Load ─── */
async function loadDefects(){
  if(!currentSite||!currentFloor)return;
  try{
    const r=await apiFetch(`/query?site=${encodeURIComponent(currentSite)}&floor=${encodeURIComponent(currentFloor)}&status=`);
    allDefects=await r.json();
    if(!Array.isArray(allDefects))allDefects=[];
    redrawCanvas();renderList();
  }catch(e){console.warn(e);}
}

/* ─── List ─── */
function renderList(){
  const el=document.getElementById('defectList');
  const f=listFilter==='ALL'?allDefects:allDefects.filter(d=>d.Status.includes(listFilter));
  if(!f.length){el.innerHTML='<div style="text-align:center;padding:40px;color:#888">📭 暫無缺失紀錄</div>';return;}
  el.innerHTML=f.map(d=>{
    const cls=d.Status.includes('待改善')?'todo':d.Status.includes('待驗收')?'review':'done';
    const bg=cls==='todo'?'#fdecea':cls==='review'?'#e3f2fd':'#e8f8ee';
    const tc=cls==='todo'?'#e74c3c':cls==='review'?'#2980b9':'#27ae60';
    return`<div class="dc ${cls}" onclick="openDetailById(${d.ID})">
      <div class="dc-hd"><div class="dc-title">${d.Description||'無說明'}</div><div class="dc-st" style="background:${bg};color:${tc}">${d.Status}</div></div>
      <div class="dc-meta">🔧 ${d.Dept} | 📍 ${d.Floor} | 👤 ${d.UserName}<br>🕒 ${(d.TimeStamp||'').substring(0,16)}</div>
    </div>`;
  }).join('');
}
function filterList(s,el){listFilter=s;document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');renderList();}

async function openDetail(d){
  currentDetailId=d.ID;
  document.getElementById('detailMask').style.display='block';
  const card=document.getElementById('detailCard');card.style.display='block';setTimeout(()=>card.classList.add('open'),10);

  document.getElementById('editDescInput').value=d.Description||'';
  document.getElementById('fixPhotoWrap').style.display=d.Status.includes('待改善')?'block':'none';

    const type=(d.Status.includes('待驗收')||d.Status.includes('已改善'))?'fixed':'original';
    const r=await fetch(`${apiBase}/image/${d.ID}/${type}?cb=${Date.now()}`,{headers:{'ngrok-skip-browser-warning':'true'}});
    if(r.ok){const b=await r.blob();img.src=URL.createObjectURL(b);wrap.style.display='block';}
  }catch(e){}

  buildActBtns(d);
}
function buildActBtns(d){
  const row=document.getElementById('actionRow');row.innerHTML='';
  if(d.Status.includes('待改善')){
    const b=document.createElement('button');b.className='act-btn a-orange';b.textContent='📤 送交驗收';b.onclick=()=>updateStatus(d.ID,'🔵 待驗收');row.appendChild(b);
  }else if(d.Status.includes('待驗收')){
    const ba=document.createElement('button');ba.className='act-btn a-green';ba.textContent='✅ 驗收通過';ba.onclick=()=>updateStatus(d.ID,'🟢 已改善');row.appendChild(ba);
    const br=document.createElement('button');br.className='act-btn a-red';br.textContent='❌ 退回重修';br.onclick=()=>updateStatus(d.ID,'🔴 待改善');row.appendChild(br);
  }else{
    const b=document.createElement('button');b.className='act-btn a-gray';b.textContent='🔄 重設待改善';b.onclick=()=>updateStatus(d.ID,'🔴 待改善');row.appendChild(b);
  }
}
function closeDetail(){

/* ─── Status update ─── */
async function updateStatus(id,status){
  let imgB64=null;if(fixPhotoBase64)imgB64=fixPhotoBase64.replace(/^data:image\/\w+;base64,/,'');
  try{
    const r=await apiFetch('/update-status',{method:'POST',body:JSON.stringify({id,status,operator:myUser||'現場人員',imageBase64:imgB64})});
    const res=await r.json();
    if(res.success){showToast('✅ 狀態已更新：'+status);closeDetail();await loadDefects();}
    else showToast('❌ 更新失敗');
  }catch(e){showToast('❌ 連線異常');}
}

async function saveDesc(){

}

}

/* ─── Offline sync ─── */
async function checkQ(){
  const items=await getAllQ().catch(()=>[]);
  const bar=document.getElementById('offlineBar');
  if(items.length>0){bar.style.display='block';document.getElementById('offlineCount').textContent=items.length;}
  else bar.style.display='none';
}
async function syncOffline(){
  if(!isOnline){showToast('⚠️ 仍無網路連線');return;}
  const items=await getAllQ().catch(()=>[]);
  let ok=0;
  for(const item of items){
    try{const r=await apiFetch('/add',{method:'POST',body:JSON.stringify(item.p)});const res=await r.json();if(res.success){await delQ(item.id);ok++;}}catch(e){}
  }
  showToast(`✅ 同步完成：成功 ${ok}/${items.length} 筆`);checkQ();if(ok>0)await loadDefects();
}

/* ─── Utils ─── */
function apiFetch(path,opts={}){return fetch(apiBase+path,{...opts,headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true',...(opts.headers||{})}});}
let _tt;function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),3000);}
</script>
