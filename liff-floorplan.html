<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>同興營造 — 現場缺失管理</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --orange:#f39c12;--red:#e74c3c;--green:#27ae60;
  --blue:#2980b9;--gray:#7f8c8d;--dark:#2c3e50;
  --bg:#f4f4f4;--card:#fff;--border:#ddd;
  --shadow:0 2px 10px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:var(--dark);overflow-x:hidden;touch-action:manipulation}

/* Header */
.header{background:var(--orange);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:300;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;opacity:.85;margin-top:2px}

/* Offline banner */
#offlineBanner{display:none;background:#c0392b;color:#fff;text-align:center;padding:9px;font-weight:700;font-size:13px;cursor:pointer;position:sticky;top:0;z-index:999}

/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:54px;z-index:200}
.tab{flex:1;text-align:center;padding:11px 2px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--orange);border-color:var(--orange)}

/* Selector bar */
.sel-bar{display:flex;gap:7px;padding:9px 11px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sel-bar select{flex:1;min-width:90px;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;background:#f8f9fa;appearance:none;font-weight:600}
.refresh-btn{padding:8px 11px;background:var(--orange);color:#fff;border:none;border-radius:7px;font-size:14px;cursor:pointer}

/* Export row */
.export-row{display:flex;gap:7px;padding:8px 11px;background:#f8f9fa;border-bottom:1px solid var(--border);display:none}
.exp-btn{flex:1;padding:8px 5px;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.exp-all  {background:#1e8449;color:#fff}
.exp-trade{background:#1a5276;color:#fff}

/* ★ 地圖容器 — 與驗屋系統完全相同 */
#mapPage{display:none}
.map-container{position:relative;width:100%;display:flex;justify-content:center;overflow:auto;background:#ccc;border-bottom:3px solid var(--orange)}
#floorPlan{width:100%;height:auto;background:#fff;cursor:crosshair;display:block}
.hint-bar{position:absolute;top:0;left:0;right:0;background:rgba(255,234,167,.92);color:#d63031;text-align:center;padding:9px 0;font-size:14px;font-weight:700;z-index:10;pointer-events:none}
.hint-bar.ready{background:rgba(39,174,96,.15);color:#1e8449}

/* FAB */
.fab{position:fixed;bottom:22px;right:14px;width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(243,156,18,.55);cursor:pointer;z-index:250;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}

/* Sheet */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:500;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 8px}
.sheet-title{font-size:15px;font-weight:700;padding:0 15px 10px;border-bottom:1px solid var(--border)}
.sheet-body{padding:13px 15px}

/* Form */
.fg{margin-bottom:12px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--gray);margin-bottom:5px}
.req{color:var(--red)}
select.ff,textarea.ff{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:#f8f9fa;appearance:none}
select.ff:focus,textarea.ff:focus{border-color:var(--orange);background:#fff;outline:none}
textarea.ff{height:72px;resize:none}
.pin-info{background:#fff8ec;border:1.5px solid var(--orange);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;margin-bottom:11px;display:none}
.pin-warn{background:#fdecea;border:1.5px solid var(--red);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--red);font-weight:700;margin-bottom:11px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{padding:6px 12px;border-radius:13px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer}
.chip.active{border-color:var(--orange);background:#fff8ec;color:var(--orange)}
.photo-zone{border:2px dashed var(--border);border-radius:9px;padding:15px;text-align:center;position:relative;background:#fafafa;cursor:pointer}
.photo-zone:active{border-color:var(--orange);background:#fff8ec}
.photo-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph-icon{font-size:26px;margin-bottom:4px}
.ph-text{font-size:12px;color:var(--gray)}
#photoPreview{width:100%;border-radius:7px;margin-top:7px;display:none;max-height:180px;object-fit:cover}
.btn-submit{width:100%;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btn-submit:disabled{background:#b2bec3}
.btn-cancel{width:100%;padding:11px;background:#f0f0f0;color:var(--gray);border:none;border-radius:9px;font-size:14px;cursor:pointer;margin-top:7px}

/* Detail card */
.detail-card{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:500;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;display:none}
.detail-card.open{display:block;transform:translateY(0)}
.detail-img{width: auto; max-width: 100%; max-height: 220px; object-fit: contain;}
.detail-body{padding:13px 15px}
.d-status{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:9px}
.d-todo{background:#fdecea;color:var(--red)}
.d-review{background:#e3f2fd;color:var(--blue)}
.d-done{background:#e8f8ee;color:var(--green)}
.d-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.d-meta{font-size:12px;color:var(--gray);line-height:1.9}
.act-row{display:flex;gap:7px;margin-top:11px}
.act-btn{flex:1;padding:11px 5px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.a-orange{background:var(--orange);color:#fff}
.a-green{background:var(--green);color:#fff}
.a-red{background:var(--red);color:#fff}
.a-gray{background:#f0f0f0;color:var(--gray)}
.edit-row{display:flex;gap:7px;align-items:center;margin-top:10px}
.edit-row input{flex:1;padding:8px;border:1.5px solid var(--orange);border-radius:6px;font-size:13px}
.edit-row button{padding:8px 12px;background:var(--orange);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}

/* ★ 統計卡片 (Feature ②) */
.stats-bar{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--border);margin-bottom:10px}
.stat-cell{flex:1;text-align:center;padding:9px 4px;border-right:1px solid var(--border)}
.stat-cell:last-child{border:none}
.stat-num{font-size:20px;font-weight:700;display:block;line-height:1}
.stat-label{font-size:10px;color:var(--gray);margin-top:3px;display:block}
.s-total{color:var(--dark)}
.s-todo{color:var(--red)}
.s-review{color:var(--blue)}
.s-done{color:var(--green)}
.s-rate{color:var(--orange)}

/* List page */
#listPage{display:none}
.filter-row{display:flex;gap:6px;padding:0 11px 8px;overflow-x:auto;padding-top:8px}
.filter-chip{padding:5px 13px;border-radius:13px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;white-space:nowrap}
.filter-chip.active{border-color:var(--orange);background:#fff8ec;color:var(--orange)}
.defect-list{padding:0 11px}
.dc{background:#fff;border-radius:9px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden;border-left:4px solid var(--border);cursor:pointer}
.dc.todo{border-color:var(--red)}.dc.review{border-color:var(--blue)}.dc.done{border-color:var(--green)}
.dc-hd{display:flex;justify-content:space-between;padding:9px 11px;align-items:flex-start}
.dc-title{font-weight:700;font-size:14px;flex:1;margin-right:6px;line-height:1.4}
.dc-st{font-size:11px;font-weight:700;padding:3px 6px;border-radius:5px;white-space:nowrap}
.dc-meta{padding:0 11px 9px;font-size:12px;color:var(--gray);line-height:1.8}

/* Toast */
.toast{visibility:hidden;min-width:220px;background:rgba(0,0,0,.82);color:#fff;text-align:center;border-radius:20px;padding:12px 20px;position:fixed;z-index:9999;left:50%;bottom:30px;transform:translateX(-50%);font-size:13px;font-weight:600}
.toast.show{visibility:visible;animation:fadein .4s,fadeout .4s 2.8s}
@keyframes fadein{from{bottom:0;opacity:0}to{bottom:30px;opacity:1}}
@keyframes fadeout{from{bottom:30px;opacity:1}to{bottom:0;opacity:0}}

/* Loader */
#loader{position:fixed;inset:0;background:rgba(244,244,244,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #ddd;border-top-color:var(--orange);animation:spin .8s linear infinite;margin-bottom:13px}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-size:14px;color:var(--gray);font-weight:600}
</style>
</head>
<body>
<div id="loader"><div class="spinner"></div><p>現場缺失系統載入中...</p></div>

<div id="offlineBanner" onclick="syncOffline()">📵 離線模式 — 有 <span id="offlineCount">0</span> 筆待同步，點擊立即同步</div>

<div class="header">
  <div>
    <div class="header-title">🗺️ 現場缺失管理</div>
    <div class="header-sub" id="headerSub">同興營造</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tabMap"  onclick="switchTab('map')">🗺️ 圖紙標記</div>
  <div class="tab"        id="tabList" onclick="switchTab('list')">📋 缺失清單</div>
</div>

<div class="sel-bar">
  <select id="selSite"  onchange="onSiteChange()"><option value="">— 案場 —</option></select>
  <select id="selFloor" onchange="onFloorChange()" disabled><option value="">— 樓層 —</option></select>
  <button class="refresh-btn" onclick="loadDefects()">🔄</button>
</div>

<div class="export-row" id="exportRow">
  <button class="exp-btn exp-all"   onclick="exportExcel('all')">📊 匯出總缺失單</button>
  <button class="exp-btn exp-trade" onclick="exportExcel('trade')">📋 匯出派工單</button>
</div>

<!-- ═══ MAP TAB ═══ -->
<div id="mapPage">
  <div class="map-container" id="canvas-container">
    <div class="hint-bar" id="mapHint">請選擇案場與樓層後，點擊圖紙標記缺失位置</div>
    <canvas id="floorPlan"></canvas>
  </div>
</div>

<!-- ═══ LIST TAB ═══ -->
<div id="listPage">
  <!-- ★ 統計卡片 (Feature ②) -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-cell s-total"><span class="stat-num" id="statTotal">0</span><span class="stat-label">📋 總計</span></div>
    <div class="stat-cell s-todo">  <span class="stat-num" id="statTodo">0</span><span class="stat-label">🔴 待改善</span></div>
    <div class="stat-cell s-review"><span class="stat-num" id="statReview">0</span><span class="stat-label">🔵 待驗收</span></div>
    <div class="stat-cell s-done">  <span class="stat-num" id="statDone">0</span><span class="stat-label">🟢 已改善</span></div>
    <div class="stat-cell s-rate">  <span class="stat-num" id="statRate">0%</span><span class="stat-label">✅ 完成率</span></div>
  </div>
  <div class="filter-row">
    <div class="filter-chip active" onclick="filterList('ALL',this)">全部</div>
    <div class="filter-chip" onclick="filterList('待改善',this)">🔴 待改善</div>
    <div class="filter-chip" onclick="filterList('待驗收',this)">🔵 待驗收</div>
    <div class="filter-chip" onclick="filterList('已改善',this)">🟢 已改善</div>
  </div>
  <div class="defect-list" id="defectList"></div>
</div>

<!-- FAB -->
<button class="fab" onclick="startAddMode()">＋</button>

<!-- Sheet mask & defect form -->
<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
<div class="sheet" id="defectSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle">📍 新增缺失</div>
  <div class="sheet-body">
    <input type="hidden" id="pinX"><input type="hidden" id="pinY">
    <div class="pin-info" id="pinInfo">📌 已標記位置：<span id="pinCoordText"></span></div>
    <div class="pin-warn" id="pinWarn">⚠️ 請先在圖紙上點選缺失位置，再填寫資料</div>
    <div class="fg">
      <label class="fl">工程類別 <span class="req">*</span></label>
      <div class="chip-row" id="deptChips"></div>
    </div>
    <div class="fg">
      <label class="fl">缺失說明 <span class="req">*</span></label>
      <textarea class="ff" id="defectDesc" placeholder="描述缺失狀況..."></textarea>
    </div>
    <div class="fg">
      <label class="fl">現場照片</label>
      <div class="photo-zone">
        <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="onPhotoSelected(this)">
        <div class="ph-icon">📷</div><div class="ph-text">點擊拍攝現場照片</div>
      </div>
      <img id="photoPreview">
    </div>
    <button class="btn-submit" id="btnSubmitDefect" onclick="submitDefect()">📤 送出缺失紀錄</button>
    <button class="btn-cancel" onclick="closeSheet()">取消</button>
  </div>
</div>

<!-- Detail card -->
<div class="sheet-mask" id="detailMask" onclick="closeDetail()" style="display:none"></div>
<div class="detail-card" id="detailCard">
  <div class="sheet-handle"></div>
  <img id="detailImg" class="detail-img">
  <div class="detail-body">
    <div class="d-status" id="detailStatus"></div>
    <div class="d-title"  id="detailTitle"></div>
    <div class="d-meta"   id="detailMeta"></div>
    <div class="edit-row" style="margin-top:12px">
      <input type="text" id="editDescInput" placeholder="修改說明...">
      <button onclick="saveDesc()">儲存</button>
    </div>
    <div id="fixPhotoWrap" style="display:none;margin-top:11px">
      <label class="fl">上傳改善照片</label>
      <div class="photo-zone">
        <input type="file" id="fixPhotoInput" accept="image/*" capture="environment" onchange="onFixPhotoSelected(this)">
        <div class="ph-icon">📷</div><div class="ph-text">拍攝改善後照片</div>
      </div>
      <img id="fixPhotoPreview" style="display:none;width:100%;border-radius:7px;margin-top:7px;max-height:140px;object-fit:cover">
    </div>
    <div class="act-row" id="actionRow"></div>
    <button class="btn-cancel" style="margin-top:9px" onclick="closeDetail()">關閉</button>
  </div>
</div>

<div id="toastMsg" class="toast"></div>

/* ─── IndexedDB ─── */
function openDB(){return new Promise((r,j)=>{const q=indexedDB.open('TonsinOff',1);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('q'))e.target.result.createObjectStore('q',{keyPath:'id',autoIncrement:true})};q.onsuccess=e=>{db=e.target.result;r(db)};q.onerror=()=>j(q.error)})}
function addQ(p){return new Promise((r,j)=>{const t=db.transaction('q','readwrite');const q=t.objectStore('q').add({p,ts:Date.now()});q.onsuccess=()=>r(q.result);q.onerror=()=>j()})}
function getAllQ(){return new Promise((r,j)=>{const t=db.transaction('q','readonly');const q=t.objectStore('q').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}
function delQ(id){return new Promise(r=>{const t=db.transaction('q','readwrite');t.objectStore('q').delete(id).onsuccess=r})}

function initUI(){
  // Populate sites
  const ss=document.getElementById('selSite');
  SITES.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;ss.appendChild(o)});
  if(initSite){ss.value=initSite;onSiteChange();}

  // Canvas
  floorCanvas=document.getElementById('floorPlan');
  floorCtx=floorCanvas.getContext('2d');

  // ★ 與驗屋系統相同的 click handler + touch handler
  floorCanvas.addEventListener('click',function(e){
    const rect=floorCanvas.getBoundingClientRect();
    const scaleX=floorCanvas.width/rect.width;
    const scaleY=floorCanvas.height/rect.height;
    const cx=(e.offsetX!==undefined)?e.offsetX*scaleX:(e.clientX-rect.left)*scaleX;
    const cy=(e.offsetY!==undefined)?e.offsetY*scaleY:(e.clientY-rect.top)*scaleY;
    handleCanvasTap(cx,cy);
  });

  // Touch: single-touch tap detection (ignore multi-touch pinch)
  let touchStartX=0,touchStartY=0,touchStartLen=0;
  floorCanvas.addEventListener('touchstart',function(e){
    touchStartLen=e.touches.length;
    if(e.touches.length===1){touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;}
  },{passive:true});
  floorCanvas.addEventListener('touchend',function(e){
    if(touchStartLen===1&&e.changedTouches.length===1){
      const dx=e.changedTouches[0].clientX-touchStartX;
      const dy=e.changedTouches[0].clientY-touchStartY;
      if(Math.sqrt(dx*dx+dy*dy)<10){
        const rect=floorCanvas.getBoundingClientRect();
        const scaleX=floorCanvas.width/rect.width;
        const scaleY=floorCanvas.height/rect.height;
        const cx=(e.changedTouches[0].clientX-rect.left)*scaleX;
        const cy=(e.changedTouches[0].clientY-rect.top)*scaleY;
        handleCanvasTap(cx,cy);
      }
    }
  },{passive:true});

  // Dept chips
  const cr=document.getElementById('deptChips');
  DEPT_LIST.forEach(d=>{
    const c=document.createElement('div');c.className='chip';c.textContent=d;
    c.onclick=()=>{cr.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');selectedDept=d;};
    cr.appendChild(c);
  });

  window.addEventListener('online',()=>{isOnline=true;document.getElementById('offlineBanner').style.display='none';});
  window.addEventListener('offline',()=>{isOnline=false;});

  if(initSite&&initFloor){setTimeout(()=>{loadFloorPlan();loadDefects();},100);}
}

function loadFloorPlan(){
  const hint=document.getElementById('mapHint');
  if(NO_MAP.includes(currentFloor)){
    floorCanvas.width=600;floorCanvas.height=300;
    floorCtx.fillStyle='#e0e0e0';floorCtx.fillRect(0,0,600,300);
    floorCtx.fillStyle='#888';floorCtx.font='16px sans-serif';floorCtx.textAlign='center';
    floorCtx.fillText('此樓層無平面圖紙',300,150);
    hint.textContent='⚠️ 此樓層無平面圖紙，仍可新增缺失（不標記位置）';
    hint.className='hint-bar';drawDefects(allDefects);return;
  }
  hint.textContent='⏳ 載入圖紙中...';hint.className='hint-bar';
  floorImg=new Image();floorImg.crossOrigin='anonymous';
  floorImg.onload=()=>{
    floorCanvas.width=floorImg.naturalWidth;floorCanvas.height=floorImg.naturalHeight;
    floorCtx.drawImage(floorImg,0,0);drawDefects(allDefects);
    hint.textContent='📍 點擊圖面標記缺失位置，或點擊已有標記查看詳情';
    hint.className='hint-bar ready';
  };
  floorImg.onerror=()=>{
    floorCanvas.width=600;floorCanvas.height=400;
    floorCtx.fillStyle='#e0e0e0';floorCtx.fillRect(0,0,600,400);
    floorCtx.fillStyle='#666';floorCtx.font='16px sans-serif';floorCtx.textAlign='center';
    floorCtx.fillText('圖紙尚未上傳：'+currentFloor,300,200);
    hint.textContent='⚠️ 圖紙尚未上傳，點擊任意位置仍可新增缺失';
    hint.className='hint-bar';drawDefects(allDefects);
  };
  const m=FLOOR_IMG[currentSite];
  floorImg.src=m&&m[currentFloor]?(GH_PAGES+m[currentFloor]):`${GH_PAGES}/${encodeURIComponent(currentSite)}/${encodeURIComponent(currentFloor)}.png`;
}

function renderCanvas(){
  floorCtx.clearRect(0,0,floorCanvas.width,floorCanvas.height);
  if(floorImg.complete&&floorImg.naturalWidth>0)floorCtx.drawImage(floorImg,0,0);
  drawDefects(allDefects);
}

function drawDefects(defects){
  defects.forEach(d=>{
    if(!d.XY_Coord||d.XY_Coord==='略過')return;
    const m=d.XY_Coord.match(/X:([\d.]+)%,\s*Y:([\d.]+)%/);if(!m)return;
    const px=parseFloat(m[1])/100*floorCanvas.width,py=parseFloat(m[2])/100*floorCanvas.height;
    const col=d.Status.includes('待改善')?'#e74c3c':d.Status.includes('待驗收')?'#2980b9':'#27ae60';
    drawPin(px,py,d.ID,col);
  });
}
function drawPin(px,py,id,color){
  const r=Math.max(12,floorCanvas.width*0.016);
  floorCtx.beginPath();floorCtx.arc(px,py,r,0,Math.PI*2);floorCtx.fillStyle=color;floorCtx.fill();
  floorCtx.beginPath();floorCtx.arc(px,py,r,0,Math.PI*2);floorCtx.strokeStyle='#fff';floorCtx.lineWidth=2;floorCtx.stroke();
  floorCtx.fillStyle='#fff';floorCtx.font=`bold ${r}px sans-serif`;floorCtx.textAlign='center';floorCtx.textBaseline='middle';
  floorCtx.fillText(String(id).slice(-2),px,py);
}
function drawPendingPin(px,py){
  renderCanvas();
  const r=Math.max(12,floorCanvas.width*0.016);
  floorCtx.beginPath();floorCtx.arc(px,py,r,0,Math.PI*2);floorCtx.fillStyle='rgba(243,156,18,.85)';floorCtx.fill();
  floorCtx.beginPath();floorCtx.arc(px,py,r,0,Math.PI*2);floorCtx.strokeStyle='#fff';floorCtx.lineWidth=2;floorCtx.stroke();
  floorCtx.fillStyle='#fff';floorCtx.font=`bold ${r}px sans-serif`;floorCtx.textAlign='center';floorCtx.textBaseline='middle';
  floorCtx.fillText('＋',px,py);
}

/* ─── Canvas tap ─── */
function handleCanvasTap(cx,cy){
  if(!currentSite||!currentFloor){showToast('⚠️ 請先選擇案場與樓層');return;}
  const hit=allDefects.find(d=>{
    if(!d.XY_Coord||d.XY_Coord==='略過')return false;
    const m=d.XY_Coord.match(/X:([\d.]+)%,\s*Y:([\d.]+)%/);if(!m)return false;
    const dpx=parseFloat(m[1])/100*floorCanvas.width,dpy=parseFloat(m[2])/100*floorCanvas.height;
    return Math.sqrt((cx-dpx)**2+(cy-dpy)**2)<Math.max(14,floorCanvas.width*0.02);
  });
  if(hit){openDetail(hit);return;}
  pendingX=(cx/floorCanvas.width*100).toFixed(1);pendingY=(cy/floorCanvas.height*100).toFixed(1);hasPendingPin=true;
  drawPendingPin(cx,cy);openSheet();
}

/* ─── Submit ─── */
async function submitDefect(){
  if(!selectedDept){showToast('⚠️ 請選擇工程類別');return;}
  const desc=document.getElementById('defectDesc').value.trim();
  if(!desc){showToast('⚠️ 請填寫缺失說明');return;}
  const xyCoord=hasPendingPin?`[座標] X:${pendingX}%, Y:${pendingY}%`:'略過';
  const btn=document.getElementById('btnSubmitDefect');btn.disabled=true;btn.textContent='⏳ 送出中...';
  const payload={userId:lineId||myUserId,userName:myUser||'現場人員',site:currentSite,floor:currentFloor,dept:selectedDept,description:desc,xyCoord,status:'🔴 待改善',imageBase64:photoBase64?photoBase64.replace(/^data:image\/\w+;base64,/,''):null};
  if(!isOnline){await addQ({type:'add',...payload});checkQCount();showToast('📵 已存入離線佇列，上線後同步');closeSheet();btn.disabled=false;btn.textContent='📤 送出缺失紀錄';return;}
  try{
    const r=await apiFetch('/add',{method:'POST',body:JSON.stringify(payload)});
    const res=await r.json();
    if(res.success){showToast('✅ #'+res.newId+' 缺失已建立！可繼續新增...');closeSheet();await loadDefects();const hint=document.getElementById('mapHint');hint.textContent='📍 繼續點選圖紙新增下一筆缺失';hint.className='hint-bar ready';}
    else showToast('❌ 送出失敗：'+(res.error||'伺服器錯誤'));
  }catch(e){showToast('❌ 連線異常，存入離線佇列');await addQ({type:'add',...payload});checkQCount();closeSheet();}
  finally{btn.disabled=false;btn.textContent='📤 送出缺失紀錄';hasPendingPin=false;photoBase64=null;}
}

async function loadDefects(){
  if(!currentSite||!currentFloor)return;
  try{
    const r=await apiFetch(`/query?site=${encodeURIComponent(currentSite)}&floor=${encodeURIComponent(currentFloor)}&status=`);
    const d=await r.json();allDefects=Array.isArray(d)?d:[];
    renderCanvas();updateStats();renderList();
  }catch(e){console.warn(e);}
}

/* ─── Stats (Feature ②) ─── */
function updateStats(){
  const tot=allDefects.length;
  const todo  =allDefects.filter(d=>d.Status.includes('待改善')).length;
  const review=allDefects.filter(d=>d.Status.includes('待驗收')).length;
  const done  =allDefects.filter(d=>d.Status.includes('已改善')).length;
  const rate  =tot>0?Math.round(done/tot*100):0;
  document.getElementById('statTotal').textContent=tot;
  document.getElementById('statTodo').textContent=todo;
  document.getElementById('statReview').textContent=review;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statRate').textContent=rate+'%';
}

/* ─── List ─── */
function renderList(){
  updateStats();
  const el=document.getElementById('defectList');
  const f=listFilter==='ALL'?allDefects:allDefects.filter(d=>d.Status.includes(listFilter));
  if(!f.length){el.innerHTML='<div style="text-align:center;padding:40px;color:#888">📭 暫無缺失紀錄</div>';return;}
  el.innerHTML=f.map(d=>{
    const cls=d.Status.includes('待改善')?'todo':d.Status.includes('待驗收')?'review':'done';
    const bg=cls==='todo'?'#fdecea':cls==='review'?'#e3f2fd':'#e8f8ee';
    const tc=cls==='todo'?'#e74c3c':cls==='review'?'#2980b9':'#27ae60';
    return`<div class="dc ${cls}" onclick="openDetailById(${d.ID})">
      <div class="dc-hd"><div class="dc-title">${d.Description||'無說明'}</div><div class="dc-st" style="background:${bg};color:${tc}">${d.Status}</div></div>
      <div class="dc-meta">🔧 ${d.Dept} | 📍 ${d.Floor} | 👤 ${d.UserName}<br>🕒 ${(d.TimeStamp||'').substring(0,16)}</div>
    </div>`;
  }).join('');
}

  // ★ 顯示改善前照片 (original)
  const imgEl = document.getElementById('detailImg');
  imgEl.style.cssText = 'display:none;width:auto;max-width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin:8px auto;display:block';
  imgEl.style.display = 'none';
 
  try {
    const r = await fetch(`${apiBase}/image/${d.ID}/original?cb=${Date.now()}`,
      { headers: { 'ngrok-skip-browser-warning': 'true' } });
    if (r.ok) {
      const b = await r.blob();
      imgEl.src = URL.createObjectURL(b);
      imgEl.style.display = 'block';
    }
  } catch (e) {}
 
  // ★ 待驗收/已改善時，額外顯示改善後照片
  const fixImgSection = document.getElementById('fixImgSection');
  if (fixImgSection) fixImgSection.remove();
 
  if (d.Status.includes('待驗收') || d.Status.includes('已改善')) {
    try {
      const rf = await fetch(`${apiBase}/image/${d.ID}/fixed?cb=${Date.now()}`,
        { headers: { 'ngrok-skip-browser-warning': 'true' } });
      if (rf.ok && rf.headers.get('content-type')?.includes('image')) {
        const bf = await rf.blob();
        const section = document.createElement('div');
        section.id = 'fixImgSection';
        section.style.cssText = 'padding:0 15px;margin-bottom:8px;';
        section.innerHTML = '<p style="font-size:12px;color:#27ae60;font-weight:700;margin-bottom:4px;">✅ 改善後照片：</p>';
        const fixImg = document.createElement('img');
        fixImg.src = URL.createObjectURL(bf);
        fixImg.style.cssText = 'width:auto;max-width:100%;max-height:200px;object-fit:contain;border-radius:8px;display:block;border:2px solid #27ae60;';
        section.appendChild(fixImg);
        document.getElementById('detailCard').querySelector('.detail-body').prepend(section);
      }
    } catch (e) {}
  }
 
  // 改善照片上傳：只在「待改善」且「任何人」都可以上傳
  document.getElementById('fixPhotoWrap').style.display = d.Status.includes('待改善') ? 'block' : 'none';
  fixPhotoBase64 = null;
  document.getElementById('fixPhotoPreview').style.display = 'none';
 
  buildActBtns_FIXED(d);
}
// 2. 判斷是否有驗收權限
function canApprove(defectDept) {
  // 水電/機電 工種：機電主任(3) 或 機電副理(3.5+)
  if (defectDept && (defectDept.includes('水電') || defectDept.includes('機電'))) {
    return (myRole.includes('機電') && myLevel >= 3) || myLevel >= 3.5;
  }
  // 其他工種：Level 3 (工地主任) 以上
  return myLevel >= 3;
}
 
// 3. 修改後的 buildActBtns 函式（完整替換）
function buildActBtns_FIXED(d) {
  const row = document.getElementById('actionRow');
  row.innerHTML = '';
 
  if (d.Status.includes('待改善')) {
    // 所有人都可以送交驗收，但必須先上傳改善照片
    const btn = document.createElement('button');
    btn.className = 'act-btn a-orange';
    btn.textContent = '📷 上傳改善照片並送交驗收';
    btn.onclick = () => {
      if (!fixPhotoBase64) {
        showToast('⚠️ 請先上傳改善後照片才能送交驗收');
        return;
      }
      updateStatus(d.ID, '🔵 待驗收');
    };
    row.appendChild(btn);
 
    // 顯示「必須拍照」的提示
    if (!fixPhotoBase64) {
      const hint = document.createElement('p');
      hint.style.cssText = 'font-size:12px;color:#e74c3c;margin-top:8px;text-align:center;';
      hint.textContent = '⚠️ 必須上傳改善後照片才能送交驗收';
      row.appendChild(hint);
    }
 
  } else if (d.Status.includes('待驗收')) {
    if (canApprove(d.Dept)) {
      // Level 3+ 可以驗收或退回
      const ba = document.createElement('button');
      ba.className = 'act-btn a-green';
      ba.textContent = '✅ 驗收通過';
      ba.onclick = () => updateStatus(d.ID, '🟢 已改善');
      row.appendChild(ba);
 
      const br = document.createElement('button');
      br.className = 'act-btn a-red';
      br.textContent = '❌ 退回重修';
      br.onclick = () => updateStatus(d.ID, '🔴 待改善');
      row.appendChild(br);
    } else {
      // Level 2 只能查看，不能驗收
      const info = document.createElement('p');
      info.style.cssText = 'font-size:13px;color:#2980b9;padding:10px;background:#e3f2fd;border-radius:8px;text-align:center;';
      info.textContent = '🔵 待主任驗收中，請等待工地主任確認';
      row.appendChild(info);
    }
 
  } else if (d.Status.includes('已改善')) {
    if (canApprove(d.Dept)) {
      const b = document.createElement('button');
      b.className = 'act-btn a-gray';
      b.textContent = '🔄 重設待改善';
      b.onclick = () => updateStatus(d.ID, '🔴 待改善');
      row.appendChild(b);
    }
  }
}
function closeDetail(){
  document.getElementById('detailCard').classList.remove('open');document.getElementById('detailMask').style.display='none';
  setTimeout(()=>document.getElementById('detailCard').style.display='none',320);currentDetailId=null;
}

/* ─── Actions ─── */
async function updateStatus(id,status){
  let imgB64=null;if(fixPhotoBase64)imgB64=fixPhotoBase64.replace(/^data:image\/\w+;base64,/,'');
  try{const r=await apiFetch('/update-status',{method:'POST',body:JSON.stringify({id,status,operator:myUser||'現場人員',imageBase64:imgB64})});const res=await r.json();if(res.success){showToast('✅ 狀態已更新：'+status);closeDetail();await loadDefects();}else showToast('❌ 更新失敗');}
  catch(e){showToast('❌ 連線異常');}
}
async function saveDesc(){
  const nd=document.getElementById('editDescInput').value.trim();if(!nd||!currentDetailId)return;
  try{const r=await apiFetch('/update-desc',{method:'POST',body:JSON.stringify({id:currentDetailId,description:nd,userId:lineId||myUserId})});const res=await r.json();if(res.success){showToast('✅ 說明已更新！');document.getElementById('detailTitle').textContent=nd;const d=allDefects.find(x=>x.ID==currentDetailId);if(d)d.Description=nd;renderList();}}
  catch(e){showToast('❌ 更新失敗');}
}

/* ─── Export ─── */
function exportExcel(type){
  if(!currentSite||!currentFloor){showToast('⚠️ 請先選擇案場與樓層');return;}
  const ep=type==='all'?'/export-defects-excel':'/export-dispatch-excel';
  window.open(`${apiBase}${ep}?site=${encodeURIComponent(currentSite)}&floor=${encodeURIComponent(currentFloor)}`,'_blank');
}

/* ─── Offline ─── */
async function checkQCount(){
  const items=await getAllQ().catch(()=>[]);
  const banner=document.getElementById('offlineBanner');
  if(items.length>0){banner.style.display='block';document.getElementById('offlineCount').textContent=items.length;}
  else banner.style.display='none';
}
async function syncOffline(){
  if(!isOnline){showToast('⚠️ 仍無網路連線');return;}
  const items=await getAllQ().catch(()=>[]);let ok=0;
  for(const item of items){try{const r=await apiFetch('/add',{method:'POST',body:JSON.stringify(item.p)});const res=await r.json();if(res.success){await delQ(item.id);ok++;}}catch(e){}}
  showToast(`✅ 同步：成功 ${ok}/${items.length} 筆`);checkQCount();if(ok>0)await loadDefects();
}

/* ─── Utils ─── */
function apiFetch(p,o={}){return fetch(apiBase+p,{...o,headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true',...(o.headers||{})}});}
function showToast(msg){const el=document.getElementById('toastMsg');el.textContent=msg;el.className='toast show';setTimeout(()=>el.className='toast',3200);}
</script>
