<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>同興營造 — 現場缺失管理</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
  --orange:#f39c12; --red:#e74c3c; --green:#27ae60;
  --blue:#2980b9; --gray:#7f8c8d; --dark:#2c3e50;
  --bg:#f4f4f4; --card:#fff; --border:#ddd;
  --shadow:0 2px 10px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:var(--dark);overflow-x:hidden}

/* ── Header ── */
.header{background:var(--orange);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:300;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.header-left{display:flex;align-items:center;gap:8px}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;opacity:.85}
.offline-badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;display:none}

/* ── Tab Bar ── */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:54px;z-index:200}
.tab{flex:1;text-align:center;padding:11px 2px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.tab.active{color:var(--orange);border-color:var(--orange)}

/* ── Selector Bar ── */
.sel-bar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border)}
.sel-bar select{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;background:#f8f9fa;appearance:none;font-weight:600}
.btn-refresh{padding:8px 12px;background:var(--orange);color:#fff;border:none;border-radius:7px;font-size:14px;cursor:pointer;white-space:nowrap}

/* ── Map Canvas Area ── */
#mapPage{display:none}
.map-hint{background:rgba(255,234,167,.9);color:#c0392b;text-align:center;padding:9px;font-size:13px;font-weight:700;position:relative;z-index:10}
.map-hint.add-mode{background:rgba(39,174,96,.15);color:var(--green)}
.canvas-wrap{position:relative;overflow:auto;width:100%;background:#ccc;-webkit-overflow-scrolling:touch}
canvas{display:block;width:100%;height:auto;cursor:crosshair}
.add-mode canvas{cursor:crosshair}
.view-mode canvas{cursor:default}

/* ── FAB (Add button) ── */
.fab{position:fixed;bottom:24px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(243,156,18,.55);cursor:pointer;z-index:250;display:flex;align-items:center;justify-content:center;transition:.2s}
.fab:active{transform:scale(.93)}

/* ── Defect Form Sheet ── */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:500;padding:0 0 30px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s ease;display:block}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 10px}
.sheet-title{font-size:16px;font-weight:700;color:var(--dark);padding:0 16px 10px;border-bottom:1px solid var(--border)}
.sheet-body{padding:14px 16px}

/* ── Form elements ── */
.fg{margin-bottom:13px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--gray);margin-bottom:5px}
.fl .req{color:var(--red)}
select.ff,textarea.ff,input.ff{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;background:#f8f9fa;color:var(--dark);appearance:none}
select.ff:focus,textarea.ff:focus,input.ff:focus{border-color:var(--orange);outline:none;background:#fff}
textarea.ff{height:75px;resize:none}

/* ── Photo Upload ── */
.photo-zone{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;position:relative;cursor:pointer;background:#fafafa;transition:.2s}
.photo-zone:active{border-color:var(--orange);background:#fff8ec}
.photo-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-zone .ph-icon{font-size:28px;margin-bottom:5px}
.photo-zone .ph-text{font-size:13px;color:var(--gray)}
#photoPreview{width:100%;border-radius:8px;margin-top:8px;display:none;max-height:200px;object-fit:cover}

/* ── Quick Tags ── */
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{padding:6px 12px;border-radius:14px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--gray);cursor:pointer;transition:.15s}
.chip.active{border-color:var(--orange);background:#fff8ec;color:var(--orange)}

/* ── Submit button ── */
.btn-submit{width:100%;padding:15px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 3px 10px rgba(243,156,18,.4);transition:.2s}
.btn-submit:disabled{background:#b2bec3;box-shadow:none}
.btn-cancel{width:100%;padding:12px;background:#f0f0f0;color:var(--gray);border:none;border-radius:10px;font-size:15px;cursor:pointer;margin-top:8px}

/* ── Defect Detail Card ── */
.detail-card{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:500;padding:0 0 30px;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s ease}
.detail-card.open{display:block;transform:translateY(0)}
.detail-img{width:100%;max-height:220px;object-fit:cover;background:#111}
.detail-body{padding:14px 16px}
.detail-status{display:inline-block;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:10px}
.st-todo{background:#fdecea;color:var(--red)}
.st-review{background:#e3f2fd;color:var(--blue)}
.st-done{background:#e8f8ee;color:var(--green)}
.detail-title{font-size:15px;font-weight:700;margin-bottom:6px}
.detail-meta{font-size:12px;color:var(--gray);line-height:1.8}
.action-row{display:flex;gap:8px;margin-top:12px}
.act-btn{flex:1;padding:11px 6px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.act-orange{background:var(--orange);color:#fff}
.act-green{background:var(--green);color:#fff}
.act-red{background:var(--red);color:#fff}
.act-gray{background:#f0f0f0;color:var(--gray)}

/* ── List Page ── */
#listPage{display:none;padding:12px}
.filter-row{display:flex;gap:7px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.filter-chip{padding:6px 14px;border-radius:14px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--gray);cursor:pointer;white-space:nowrap;transition:.15s}
.filter-chip.active{border-color:var(--orange);background:#fff8ec;color:var(--orange)}
.defect-card{background:#fff;border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;border-left:4px solid var(--border);cursor:pointer;transition:.15s}
.defect-card.todo{border-color:var(--red)}
.defect-card.review{border-color:var(--blue)}
.defect-card.done{border-color:var(--green)}
.defect-card:active{opacity:.85}
.dc-header{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px}
.dc-title{font-weight:700;font-size:14px;flex:1;margin-right:8px;line-height:1.4}
.dc-status{font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap}
.dc-meta{padding:0 12px 10px;font-size:12px;color:var(--gray);line-height:1.7}

/* ── Offline queue indicator ── */
.offline-bar{background:#e74c3c;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;display:none;cursor:pointer}

/* ── Edit mode ── */
.edit-field{display:flex;gap:8px;align-items:center}
.edit-field input{flex:1;padding:8px;border:1.5px solid var(--orange);border-radius:6px;font-size:14px}
.edit-field button{padding:8px 12px;background:var(--orange);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}

/* ── Toast ── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(0,0,0,.82);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:600;z-index:9999;transition:transform .28s;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── Loader ── */
#globalLoader{position:fixed;inset:0;background:rgba(244,244,244,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid #ddd;border-top-color:var(--orange);animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
#globalLoader p{font-size:14px;color:var(--gray);font-weight:600}

/* ── Defect pin ── */
.pin-label{font-size:10px;font-weight:700;fill:#fff}
</style>
</head>
<body>

<div id="globalLoader"><div class="spinner"></div><p>系統載入中...</p></div>

<div class="offline-bar" id="offlineBar" onclick="syncOffline()">
  📶 離線模式：有 <span id="offlineCount">0</span> 筆待同步資料，點擊立即同步
</div>

<div class="header">
  <div class="header-left">
    <div>
      <div class="header-title">🗺️ 現場缺失管理</div>
      <div class="header-sub" id="headerSub">同興營造</div>
    </div>
  </div>
  <div class="offline-badge" id="onlineBadge">📶 離線</div>
</div>

<!-- Tab Bar -->
<div class="tabs">
  <div class="tab active" id="tabMap" onclick="switchTab('map')">🗺️ 圖紙標記</div>
  <div class="tab" id="tabList" onclick="switchTab('list')">📋 缺失清單</div>
</div>

<!-- ── Selector Bar ── -->
<div class="sel-bar">
  <select id="selSite" onchange="onSiteChange()">
    <option value="">— 選擇案場 —</option>
  </select>
  <select id="selFloor" onchange="onFloorChange()" disabled>
    <option value="">— 選擇樓層 —</option>
  </select>
  <button class="btn-refresh" onclick="loadDefects()">🔄</button>
</div>

<!-- ══════════ MAP TAB ══════════ -->
<div id="mapPage">
  <div class="map-hint" id="mapHint">📌 請選擇案場與樓層後，點擊圖紙新增缺失</div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="floorCanvas"></canvas>
  </div>
</div>

<!-- ══════════ LIST TAB ══════════ -->
<div id="listPage">
  <div class="filter-row">
    <div class="filter-chip active" onclick="filterList('ALL',this)">全部</div>
    <div class="filter-chip" onclick="filterList('待改善',this)">🔴 待改善</div>
    <div class="filter-chip" onclick="filterList('待驗收',this)">🔵 待驗收</div>
    <div class="filter-chip" onclick="filterList('已改善',this)">🟢 已改善</div>
  </div>
  <div id="defectList"></div>
</div>

<!-- ── FAB ── -->
<button class="fab" id="fabAdd" onclick="startAddMode()" title="新增缺失">＋</button>

<!-- ══════════ Sheet Mask ══════════ -->
<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>

<!-- ══════════ Add/Edit Defect Sheet ══════════ -->
<div class="sheet" id="defectSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle">📍 新增缺失</div>
  <div class="sheet-body">
    <input type="hidden" id="editDefectId">
    <input type="hidden" id="pinX">
    <input type="hidden" id="pinY">

    <!-- 位置顯示 -->
    <div id="pinConfirm" style="background:#fff8ec;border:1.5px solid var(--orange);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;margin-bottom:12px;display:none;">
      📌 已標記位置：<span id="pinCoordText"></span>
    </div>
    <div id="pinWaiting" style="background:#fdecea;border:1.5px solid var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;color:var(--red);font-weight:700;">
      ⚠️ 請先在圖紙上點選缺失位置，再填寫以下資料
    </div>

    <!-- 工種 -->
    <div class="fg">
      <label class="fl">工程類別 <span class="req">*</span></label>
      <div class="chip-row" id="deptChips"></div>
    </div>

    <!-- 說明 -->
    <div class="fg">
      <label class="fl">缺失說明 <span class="req">*</span></label>
      <textarea class="ff" id="defectDesc" placeholder="請描述缺失狀況，例如：裂縫、漏水、施工不符規定..."></textarea>
    </div>

    <!-- 照片 -->
    <div class="fg">
      <label class="fl">現場照片</label>
      <div class="photo-zone">
        <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="onPhotoSelected(this)">
        <div class="ph-icon">📷</div>
        <div class="ph-text">點擊拍攝現場照片</div>
      </div>
      <img id="photoPreview">
    </div>

    <button class="btn-submit" id="btnSubmitDefect" onclick="submitDefect()">📤 送出缺失紀錄</button>
    <button class="btn-cancel" onclick="closeSheet()">取消</button>
  </div>
</div>

<!-- ══════════ Defect Detail Card ══════════ -->
<div class="sheet-mask" id="detailMask" onclick="closeDetail()" style="display:none"></div>
<div class="detail-card" id="detailCard">
  <div class="sheet-handle" style="margin:12px auto 0;"></div>
  <img id="detailImg" class="detail-img" style="display:none">
  <div class="detail-body">
    <div class="detail-status" id="detailStatus"></div>
    <div class="detail-title" id="detailTitle"></div>
    <div class="detail-meta" id="detailMeta"></div>

    <!-- 編輯說明 -->
    <div class="fg" id="editDescSection" style="display:none;margin-top:12px;">
      <label class="fl">修改說明</label>
      <div class="edit-field">
        <input type="text" id="editDescInput" placeholder="輸入新說明...">
        <button onclick="saveDesc()">儲存</button>
      </div>
    </div>

    <!-- 改善照片上傳 -->
    <div class="fg" id="fixPhotoSection" style="display:none;margin-top:12px;">
      <label class="fl">上傳改善照片</label>
      <div class="photo-zone">
        <input type="file" id="fixPhotoInput" accept="image/*" capture="environment" onchange="onFixPhotoSelected(this)">
        <div class="ph-icon">📷</div>
        <div class="ph-text">拍攝改善後照片</div>
      </div>
      <img id="fixPhotoPreview" style="display:none;width:100%;border-radius:8px;margin-top:8px;max-height:150px;object-fit:cover;">
    </div>

    <!-- 狀態操作按鈕 -->
    <div class="action-row" id="actionRow"></div>
    <button class="btn-cancel" style="margin-top:10px;" onclick="closeDetail()">關閉</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ─── Config ─── */
const urlP    = new URLSearchParams(window.location.search);
const apiBase = urlP.get('api') || 'https://unpregnant-tonically-caitlyn.ngrok-free.dev';
const initSite  = decodeURIComponent(urlP.get('site')  || '');
const initFloor = decodeURIComponent(urlP.get('floor') || '');
const initMode  = urlP.get('mode') || 'mark';   // mark | overview
const initFocus = urlP.get('focusId') || '';
const myUser    = decodeURIComponent(urlP.get('user')   || '');
const myUserId  = urlP.get('userId') || '';
const LIFF_ID   = "2009287087-4LSCRAq4";
const GH_PAGES  = "https://yehlc.github.io/Tonsin/";

/* ─── Site / Floor Config (same as Config.gs) ─── */
const SITE_FLOOR_CONFIG = {
  "98工地": { "全區與戶外":["全區配置圖"], "地下室(B1-B4)":["B1F","B2F","B3F","B4F"], "共通樓層(1F-2F)":["1F","1MF","2F"], "A棟低樓層(3F-10F)":["3F_A","4F_A","5F_A","6F_A","7F_A","8F_A","9F_A","10F_A"], "B棟低樓層(3F-10F)":["3F_B","4F_B","5F_B","6F_B","7F_B","8F_B","9F_B","10F_B"], "A棟高樓層(11F-20F)":["11F_A","12F_A","13F_A","14F_A","15F_A","16F_A","17F_A","18F_A","19F_A","20F_A"], "B棟高樓層(11F-19F)":["11F_B","12F_B","13F_B","14F_B","15F_B","16F_B","17F_B","18F_B","19F_B"], "R樓層(R1-R3)":["R1F","R2F","R3F","PRF"], "地工階段":["地工階段"] },
  "99工地": { "全區與戶外":["全區配置圖"], "CBF(轉換層)":["CBF"], "地下室(B1-B3)":["B1F","B2F","B3F","B4F"], "低樓層(1F-10F)":["1F","2F","3F","4F","5F","6F","7F","8F","9F","10F"], "高樓層(11F-14F)":["11F","12F","13F","14F"], "R樓層(R1-R3)":["R1F","R2F","R3F"], "地工階段":["地工階段"] },
  "95工地": { "全區與戶外":["全區配置圖"], "CBF(轉換層)":["CBF"], "地下室(B1-B3)":["B1F","B2F","B3F"], "標準層(1F-7F)":["1F","1MF","2F","3F","4F","5F","6F","7F"], "R樓層(R1-R3)":["R1F","R2F","R3F"], "地工階段":["地工階段"] },
  "鼎隆大苑": { "全區與戶外":["全區配置圖"], "地下室(B1-B4)":["B1F","B2F","B3F","B4F"], "低樓層(1F-10F)":["1F","2F","3F","4F","5F","6F","7F","8F","9F","10F"], "高樓層(11F-19F)":["11F","12F","13F","14F","15F","16F","17F","18F","19F"], "R樓層(R1-R3)":["R1F","R2F","R3F"], "地工階段":["地工階段"] },
};
const DEFAULT_FLOORS = { "全區與戶外":["全區配置圖","戶外周邊","屋頂外觀"], "地下室(B1-B4)":["B1F","B2F","B3F","B4F"], "標準層(1F-10F)":["1F","2F","3F","4F","5F","6F","7F","8F","9F","10F"], "地工階段":["地工階段"] };
const SITES = Object.keys(SITE_FLOOR_CONFIG).concat(["毅聯R8","毅聯寧夏","廣宇江南","內湖富樂群","中壢映象","測試工地"]);
const DEPT_LIST = ["鋼筋工程","模板工程","混凝土","水電/機電","裝修/其他","安全衛生"];
const NO_MAP_FLOORS = ["地工階段","戶外周邊","屋頂外觀"];

/* ─── State ─── */
let lineId = '';
let currentSite = initSite, currentFloor = initFloor;
let allDefects = [], listFilter = 'ALL';
let addModeActive = false;
let pendingX = 0, pendingY = 0, hasPendingPin = false;
let photoBase64 = null, fixPhotoBase64 = null;
let selectedDept = '';
let currentDetailId = null;
let floorImg = new Image();
let canvas, ctx;
let isOnline = navigator.onLine;

/* ─── IndexedDB for offline queue ─── */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('TonsinOffline', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('queue')) d.createObjectStore('queue', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = () => rej(req.error);
  });
}
function addToQueue(payload) {
  return new Promise((res, rej) => {
    const tx = db.transaction('queue', 'readwrite');
    const req = tx.objectStore('queue').add({ payload, ts: Date.now() });
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function getAllQueue() {
  return new Promise((res, rej) => {
    const tx = db.transaction('queue', 'readonly');
    const req = tx.objectStore('queue').getAll();
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function deleteFromQueue(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction('queue', 'readwrite');
    tx.objectStore('queue').delete(id).onsuccess = () => res();
  });
}

/* ─── LIFF Init ─── */
Promise.all([
  liff.init({ liffId: LIFF_ID }).then(async () => {
    if (liff.isLoggedIn()) { const p = await liff.getProfile(); lineId = p.userId; }
  }).catch(() => {}),
  openDB()
]).then(() => {
  initUI();
  document.getElementById('globalLoader').style.display = 'none';
  checkOfflineQueue();
});

/* ─── UI Init ─── */
function initUI() {
  // Populate sites
  const selSite = document.getElementById('selSite');
  SITES.forEach(s => {
    const o = document.createElement('option'); o.value = s; o.textContent = s; selSite.appendChild(o);
  });
  if (initSite) { selSite.value = initSite; onSiteChange(); }

  // Canvas
  canvas = document.getElementById('floorCanvas');
  ctx = canvas.getContext('2d');
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('touchend', onCanvasTouch, { passive: false });

  // Dept chips
  const chipRow = document.getElementById('deptChips');
  DEPT_LIST.forEach(d => {
    const c = document.createElement('div');
    c.className = 'chip'; c.textContent = d;
    c.onclick = () => { chipRow.querySelectorAll('.chip').forEach(x => x.classList.remove('active')); c.classList.add('active'); selectedDept = d; };
    chipRow.appendChild(c);
  });

  // Online/offline
  window.addEventListener('online',  () => { isOnline = true;  updateOnlineUI(); });
  window.addEventListener('offline', () => { isOnline = false; updateOnlineUI(); });
  updateOnlineUI();

  // Load initial data
  if (initSite && initFloor) {
    setTimeout(() => { loadFloorPlan(); loadDefects(); }, 100);
  }

  // Focus specific defect
  if (initFocus) setTimeout(() => { const d = allDefects.find(x => x.ID == initFocus); if (d) openDetail(d); }, 1500);
}

function updateOnlineUI() {
  const b = document.getElementById('onlineBadge');
  if (!isOnline) { b.style.display = 'block'; b.textContent = '📵 離線'; }
  else { b.style.display = 'none'; }
}

/* ─── Site/Floor Cascade ─── */
function onSiteChange() {
  currentSite = document.getElementById('selSite').value;
  currentFloor = '';
  const selFloor = document.getElementById('selFloor');
  selFloor.innerHTML = '<option value="">— 選擇樓層 —</option>';
  selFloor.disabled = !currentSite;
  if (!currentSite) return;

  const cfg = SITE_FLOOR_CONFIG[currentSite] || DEFAULT_FLOORS;
  Object.values(cfg).flat().forEach(f => {
    const o = document.createElement('option'); o.value = f; o.textContent = f; selFloor.appendChild(o);
  });
  if (initFloor) { selFloor.value = initFloor; onFloorChange(); }
  document.getElementById('headerSub').textContent = currentSite;
}
function onFloorChange() {
  currentFloor = document.getElementById('selFloor').value;
  document.getElementById('headerSub').textContent = currentSite + (currentFloor ? ' / ' + currentFloor : '');
  if (currentSite && currentFloor) { loadFloorPlan(); loadDefects(); }
}

/* ─── Tab Switch ─── */
function switchTab(tab) {
  document.getElementById('tabMap').classList.toggle('active', tab === 'map');
  document.getElementById('tabList').classList.toggle('active', tab === 'list');
  document.getElementById('mapPage').style.display  = tab === 'map'  ? 'block' : 'none';
  document.getElementById('listPage').style.display = tab === 'list' ? 'block' : 'none';
  if (tab === 'list') renderList();
}
// init show map
document.getElementById('mapPage').style.display = 'block';

/* ─── Floor Plan Canvas ─── */
function loadFloorPlan() {
  const hint = document.getElementById('mapHint');
  if (NO_MAP_FLOORS.includes(currentFloor)) {
    hint.textContent = '⚠️ 此樓層無平面圖紙，仍可新增缺失（不標記位置）';
    hint.className = 'map-hint';
    drawDefects([]);
    return;
  }
  hint.textContent = '⏳ 載入圖紙中...';
  const imgUrl = `${GH_PAGES}${encodeURIComponent(currentSite)}/${encodeURIComponent(currentFloor)}.png`;
  floorImg = new Image();
  floorImg.crossOrigin = 'anonymous';
  floorImg.onload = () => {
    canvas.width  = floorImg.naturalWidth;
    canvas.height = floorImg.naturalHeight;
    ctx.drawImage(floorImg, 0, 0);
    drawDefects(allDefects);
    hint.textContent = '📌 點擊圖面上的位置新增缺失，或點擊現有標記查看詳情';
    hint.className = 'map-hint add-mode';
  };
  floorImg.onerror = () => {
    canvas.width = 600; canvas.height = 400;
    ctx.fillStyle = '#e0e0e0'; ctx.fillRect(0, 0, 600, 400);
    ctx.fillStyle = '#999'; ctx.font = '18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('圖紙尚未上傳', 300, 200);
    hint.textContent = '⚠️ 圖紙尚未上傳，點擊任意位置仍可新增缺失';
    hint.className = 'map-hint';
    drawDefects(allDefects);
  };
  floorImg.src = imgUrl;
}

function redrawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (floorImg.complete && floorImg.naturalWidth > 0) ctx.drawImage(floorImg, 0, 0);
  drawDefects(allDefects);
}

function drawDefects(defects) {
  defects.forEach(d => {
    if (!d.XY_Coord || d.XY_Coord === '略過') return;
    const m = d.XY_Coord.match(/X:(\d+(?:\.\d+)?)%,\s*Y:(\d+(?:\.\d+)?)%/);
    if (!m) return;
    const px = parseFloat(m[1]) / 100 * canvas.width;
    const py = parseFloat(m[2]) / 100 * canvas.height;
    const color = d.Status.includes('待改善') ? '#e74c3c' : d.Status.includes('待驗收') ? '#2980b9' : '#27ae60';
    drawPin(px, py, d.ID, color);
  });
}

function drawPin(px, py, id, color) {
  const r = Math.max(10, canvas.width * 0.018);
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `bold ${r}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(id).slice(-2), px, py);
}

function drawPendingPin(px, py) {
  redrawCanvas();
  ctx.beginPath(); ctx.arc(px, py, Math.max(10, canvas.width * 0.018), 0, Math.PI*2); ctx.fillStyle = 'rgba(243,156,18,.8)'; ctx.fill();
  ctx.beginPath(); ctx.arc(px, py, Math.max(10, canvas.width * 0.018), 0, Math.PI*2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(10, canvas.width * 0.018)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('＋', px, py);
}

/* ─── Canvas Click / Touch ─── */
function getCanvasPos(e) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / r.width;
  const scaleY = canvas.height / r.height;
  return { x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY };
}
function onCanvasClick(e) {
  const pos = getCanvasPos(e);
  handleCanvasTap(pos.x, pos.y);
}
function onCanvasTouch(e) {
  e.preventDefault();
  const t = e.changedTouches[0];
  const pos = getCanvasPos(t);
  handleCanvasTap(pos.x, pos.y);
}
function handleCanvasTap(px, py) {
  if (!currentSite || !currentFloor) { showToast('⚠️ 請先選擇案場與樓層'); return; }

  // Check if tapping on an existing defect
  const hit = findDefectAtPos(px, py);
  if (hit) { openDetail(hit); return; }

  // Otherwise place new pin
  const xPct = (px / canvas.width * 100).toFixed(1);
  const yPct = (py / canvas.height * 100).toFixed(1);
  pendingX = xPct; pendingY = yPct; hasPendingPin = true;

  drawPendingPin(px, py);
  openSheet();
}

function findDefectAtPos(px, py) {
  const r = Math.max(12, canvas.width * 0.022);
  return allDefects.find(d => {
    if (!d.XY_Coord || d.XY_Coord === '略過') return false;
    const m = d.XY_Coord.match(/X:(\d+(?:\.\d+)?)%,\s*Y:(\d+(?:\.\d+)?)%/);
    if (!m) return false;
    const dpx = parseFloat(m[1]) / 100 * canvas.width;
    const dpy = parseFloat(m[2]) / 100 * canvas.height;
    return Math.sqrt((px-dpx)**2 + (py-dpy)**2) < r;
  });
}

/* ─── FAB / Start Add Mode ─── */
function startAddMode() {
  if (!currentSite || !currentFloor) { showToast('⚠️ 請先選擇案場與樓層'); return; }
  if (NO_MAP_FLOORS.includes(currentFloor)) {
    // No map needed — open sheet directly without pin
    hasPendingPin = false; pendingX = 0; pendingY = 0;
    openSheet();
    return;
  }
  showToast('📌 請點選圖紙上的缺失位置');
  document.getElementById('mapHint').textContent = '📌 請點選缺失位置...';
}

/* ─── Sheet ─── */
function openSheet(editId) {
  document.getElementById('sheetMask').style.display = 'block';
  document.getElementById('defectSheet').classList.add('open');
  document.getElementById('editDefectId').value = editId || '';
  document.getElementById('sheetTitle').textContent = editId ? '✏️ 編輯缺失' : '📍 新增缺失';
  document.getElementById('pinX').value = pendingX;
  document.getElementById('pinY').value = pendingY;

  // Update pin confirm display
  if (hasPendingPin) {
    document.getElementById('pinConfirm').style.display = 'block';
    document.getElementById('pinWaiting').style.display = 'none';
    document.getElementById('pinCoordText').textContent = `X:${pendingX}%, Y:${pendingY}%`;
  } else {
    document.getElementById('pinConfirm').style.display = 'none';
    document.getElementById('pinWaiting').style.display = NO_MAP_FLOORS.includes(currentFloor) ? 'none' : 'block';
  }

  // Reset form
  if (!editId) {
    document.getElementById('defectDesc').value = '';
    document.getElementById('photoPreview').style.display = 'none';
    document.getElementById('photoInput').value = '';
    photoBase64 = null; selectedDept = '';
    document.getElementById('deptChips').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  }
}
function closeSheet() {
  document.getElementById('sheetMask').style.display = 'none';
  document.getElementById('defectSheet').classList.remove('open');
  hasPendingPin = false;
  redrawCanvas();
}

/* ─── Photo ─── */
function onPhotoSelected(input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    photoBase64 = e.target.result;
    const img = document.getElementById('photoPreview');
    img.src = e.target.result; img.style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}
function onFixPhotoSelected(input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    fixPhotoBase64 = e.target.result;
    const img = document.getElementById('fixPhotoPreview');
    img.src = e.target.result; img.style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}

/* ─── Submit Defect ─── */
async function submitDefect() {
  if (!selectedDept) { showToast('⚠️ 請選擇工程類別'); return; }
  const desc = document.getElementById('defectDesc').value.trim();
  if (!desc) { showToast('⚠️ 請填寫缺失說明'); return; }

  const xyCoord = hasPendingPin
    ? `[座標] X:${pendingX}%, Y:${pendingY}%`
    : (NO_MAP_FLOORS.includes(currentFloor) ? '略過' : '略過');

  const btn = document.getElementById('btnSubmitDefect');
  btn.disabled = true; btn.textContent = '⏳ 送出中...';

  const payload = {
    userId: lineId || myUserId, userName: myUser || '現場人員',
    site: currentSite, floor: currentFloor,
    dept: selectedDept, description: desc,
    xyCoord, status: '🔴 待改善',
    imageBase64: photoBase64 ? photoBase64.replace(/^data:image\/\w+;base64,/, '') : null
  };

  if (!isOnline) {
    await addToQueue({ type: 'add', ...payload });
    checkOfflineQueue();
    showToast('📵 已存入離線佇列，連線後自動同步');
    closeSheet();
    btn.disabled = false; btn.textContent = '📤 送出缺失紀錄';
    return;
  }

  try {
    const r = await apiFetch('/add', { method: 'POST', body: JSON.stringify(payload) });
    const res = await r.json();
    if (res.success) {
      showToast('✅ #' + res.newId + ' 缺失已建立！');
      closeSheet();
      await loadDefects();
      // Ready for next defect immediately!
      document.getElementById('mapHint').textContent = '📌 繼續點選圖紙新增下一筆缺失';
    } else {
      showToast('❌ 送出失敗：' + (res.error || '伺服器錯誤'));
    }
  } catch(e) {
    showToast('❌ 連線異常，已存入離線佇列');
    await addToQueue({ type: 'add', ...payload });
    checkOfflineQueue();
    closeSheet();
  } finally {
    btn.disabled = false; btn.textContent = '📤 送出缺失紀錄';
    hasPendingPin = false; photoBase64 = null;
  }
}

/* ─── Load Defects ─── */
async function loadDefects() {
  if (!currentSite || !currentFloor) return;
  try {
    const r = await apiFetch(`/query?site=${encodeURIComponent(currentSite)}&floor=${encodeURIComponent(currentFloor)}&status=`);
    const rows = await r.json();
    allDefects = Array.isArray(rows) ? rows : [];
    redrawCanvas();
    renderList();
  } catch(e) {
    console.warn('載入缺失失敗', e);
  }
}

/* ─── List Render ─── */
function renderList() {
  const el = document.getElementById('defectList');
  const filtered = listFilter === 'ALL' ? allDefects : allDefects.filter(d => d.Status.includes(listFilter));
  if (!filtered.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray);">📭 本樓層暫無缺失紀錄</div>'; return;
  }
  el.innerHTML = filtered.map(d => {
    const cls = d.Status.includes('待改善') ? 'todo' : d.Status.includes('待驗收') ? 'review' : 'done';
    const stColor = cls === 'todo' ? '#fdecea' : cls === 'review' ? '#e3f2fd' : '#e8f8ee';
    const stText  = cls === 'todo' ? 'var(--red)' : cls === 'review' ? 'var(--blue)' : 'var(--green)';
    return `<div class="defect-card ${cls}" onclick="openDetailById(${d.ID})">
      <div class="dc-header">
        <div class="dc-title">${d.Description || '無說明'}</div>
        <div class="dc-status" style="background:${stColor};color:${stText};">${d.Status}</div>
      </div>
      <div class="dc-meta">
        🔧 ${d.Dept} &nbsp;|&nbsp; 📍 ${d.Floor} &nbsp;|&nbsp; 👤 ${d.UserName}<br>
        🕒 ${(d.TimeStamp || '').substring(0, 16)}
      </div>
    </div>`;
  }).join('');
}
function filterList(status, el) {
  listFilter = status;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

/* ─── Detail Card ─── */
function openDetailById(id) {
  const d = allDefects.find(x => x.ID == id);
  if (d) openDetail(d);
}
async function openDetail(d) {
  currentDetailId = d.ID;
  document.getElementById('detailMask').style.display = 'block';
  const card = document.getElementById('detailCard');
  card.style.display = 'block'; setTimeout(() => card.classList.add('open'), 10);

  // Status badge
  const statusEl = document.getElementById('detailStatus');
  const cls = d.Status.includes('待改善') ? 'st-todo' : d.Status.includes('待驗收') ? 'st-review' : 'st-done';
  statusEl.className = 'detail-status ' + cls; statusEl.textContent = d.Status;

  document.getElementById('detailTitle').textContent = d.Description || '無說明';
  document.getElementById('detailMeta').innerHTML =
    `#${d.ID} &nbsp;|&nbsp; 🔧 ${d.Dept} &nbsp;|&nbsp; 📍 ${d.Floor}<br>👤 ${d.UserName} &nbsp;|&nbsp; 🕒 ${(d.TimeStamp||'').substring(0,16)}`;

  // Load photo
  const imgEl = document.getElementById('detailImg');
  imgEl.style.display = 'none';
  try {
    const imgType = (d.Status.includes('待驗收') || d.Status.includes('已改善')) ? 'fixed' : 'original';
    const r = await fetch(`${apiBase}/image/${d.ID}/${imgType}?cb=${Date.now()}`, { headers: { 'ngrok-skip-browser-warning':'true' } });
    if (r.ok) { const blob = await r.blob(); imgEl.src = URL.createObjectURL(blob); imgEl.style.display = 'block'; }
  } catch(e) {}

  // Edit desc section
  const editSec = document.getElementById('editDescSection');
  editSec.style.display = 'block';
  document.getElementById('editDescInput').value = d.Description || '';

  // Fix photo upload - show only for "待改善" (reporter uploads improvement photo)
  const fixSec = document.getElementById('fixPhotoSection');
  fixSec.style.display = d.Status.includes('待改善') ? 'block' : 'none';
  fixPhotoBase64 = null;
  document.getElementById('fixPhotoPreview').style.display = 'none';

  // Action buttons
  buildActionButtons(d);
}
function buildActionButtons(d) {
  const row = document.getElementById('actionRow');
  row.innerHTML = '';
  if (d.Status.includes('待改善')) {
    const btn = document.createElement('button');
    btn.className = 'act-btn act-orange'; btn.textContent = '📤 送交驗收';
    btn.onclick = () => updateStatus(d.ID, '🔵 待驗收');
    row.appendChild(btn);
  } else if (d.Status.includes('待驗收')) {
    const btnA = document.createElement('button');
    btnA.className = 'act-btn act-green'; btnA.textContent = '✅ 驗收通過';
    btnA.onclick = () => updateStatus(d.ID, '🟢 已改善');
    const btnR = document.createElement('button');
    btnR.className = 'act-btn act-red'; btnR.textContent = '❌ 退回重修';
    btnR.onclick = () => updateStatus(d.ID, '🔴 待改善');
    row.appendChild(btnA); row.appendChild(btnR);
  } else {
    const btn = document.createElement('button');
    btn.className = 'act-btn act-gray'; btn.textContent = '🔄 重設待改善';
    btn.onclick = () => updateStatus(d.ID, '🔴 待改善');
    row.appendChild(btn);
  }
}
function closeDetail() {
  document.getElementById('detailCard').classList.remove('open');
  document.getElementById('detailMask').style.display = 'none';
  setTimeout(() => { document.getElementById('detailCard').style.display = 'none'; }, 350);
  currentDetailId = null;
}

/* ─── Status Update ─── */
async function updateStatus(id, newStatus) {
  let imgB64 = null;
  if (fixPhotoBase64) imgB64 = fixPhotoBase64.replace(/^data:image\/\w+;base64,/, '');

  const payload = { id, status: newStatus, operator: myUser || '現場人員', imageBase64: imgB64 };
  try {
    const r = await apiFetch('/update-status', { method: 'POST', body: JSON.stringify(payload) });
    const res = await r.json();
    if (res.success) {
      showToast('✅ 狀態已更新為：' + newStatus);
      closeDetail();
      await loadDefects();
    } else { showToast('❌ 更新失敗'); }
  } catch(e) { showToast('❌ 連線異常'); }
}

/* ─── Edit Description ─── */
async function saveDesc() {
  const newDesc = document.getElementById('editDescInput').value.trim();
  if (!newDesc || !currentDetailId) return;
  try {
    const r = await apiFetch('/update-desc', { method: 'POST', body: JSON.stringify({ id: currentDetailId, description: newDesc, userId: lineId || myUserId }) });
    const res = await r.json();
    if (res.success) {
      showToast('✅ 說明已更新！');
      document.getElementById('detailTitle').textContent = newDesc;
      const d = allDefects.find(x => x.ID == currentDetailId);
      if (d) d.Description = newDesc;
      renderList();
    }
  } catch(e) { showToast('❌ 更新失敗'); }
}

/* ─── Offline Sync ─── */
async function checkOfflineQueue() {
  if (!db) return;
  const items = await getAllQueue();
  const bar = document.getElementById('offlineBar');
  if (items.length > 0) {
    bar.style.display = 'block';
    document.getElementById('offlineCount').textContent = items.length;
  } else {
    bar.style.display = 'none';
  }
}
async function syncOffline() {
  if (!isOnline) { showToast('⚠️ 目前仍無網路連線'); return; }
  const items = await getAllQueue();
  if (!items.length) { showToast('✅ 無待同步資料'); return; }

  let ok = 0;
  for (const item of items) {
    try {
      const p = item.payload;
      const r = await apiFetch('/add', { method: 'POST', body: JSON.stringify(p) });
      const res = await r.json();
      if (res.success) { await deleteFromQueue(item.id); ok++; }
    } catch(e) {}
  }
  showToast(`✅ 同步完成：成功 ${ok} / 共 ${items.length} 筆`);
  checkOfflineQueue();
  if (ok > 0) await loadDefects();
}

/* ─── Utils ─── */
function apiFetch(path, opts = {}) {
  return fetch(apiBase + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true', ...(opts.headers || {}) }
  });
}
let _tTimer;
function showToast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(_tTimer); _tTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
