<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>同興營造 — 現場缺失管理</title> 
<!-- ★ 效能優化：預連線到圖紙來源（節省 100-300ms DNS/TLS） -->
<link rel="preconnect" href="https://yehlc.github.io" crossorigin>
<link rel="dns-prefetch" href="https://yehlc.github.io">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--orange:#f39c12;--red:#e74c3c;--green:#27ae60;--blue:#2980b9;--gray:#7f8c8d;--dark:#2c3e50;--bg:#f4f4f4;--card:#fff;--border:#ddd;--shadow:0 2px 10px rgba(0,0,0,.1);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:var(--dark);overflow-x:hidden;touch-action:manipulation}
.header{background:var(--orange);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:300;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;opacity:.85;margin-top:2px}
#offlineBanner{display:none;background:#c0392b;color:#fff;text-align:center;padding:9px;font-weight:700;font-size:13px;cursor:pointer;position:sticky;top:0;z-index:999}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:54px;z-index:200}
.tab{flex:1;text-align:center;padding:11px 2px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--orange);border-color:var(--orange)}
.sel-bar{display:flex;gap:7px;padding:9px 11px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sel-bar select{flex:1;min-width:90px;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;background:#f8f9fa;appearance:none;font-weight:600}
.refresh-btn{padding:8px 11px;background:var(--orange);color:#fff;border:none;border-radius:7px;font-size:14px;cursor:pointer}
.export-row{display:flex;gap:7px;padding:8px 11px;background:#f8f9fa;border-bottom:1px solid var(--border)}
.exp-btn{flex:1;padding:8px 5px;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.exp-all{background:#1e8449;color:#fff}.exp-trade{background:#1a5276;color:#fff}
/* Map */
#mapPage{display:none}
.map-container{position:relative;width:100%;display:flex;justify-content:center;overflow:auto;background:#ccc;border-bottom:3px solid var(--orange)}
#floorPlan{width:100%;height:auto;background:#fff;cursor:crosshair;display:block}
.hint-bar{position:absolute;top:0;left:0;right:0;background:rgba(255,234,167,.92);color:#d63031;text-align:center;padding:9px 0;font-size:14px;font-weight:700;z-index:10;pointer-events:none}
.hint-bar.ready{background:rgba(39,174,96,.15);color:#1e8449}
.fab{position:fixed;bottom:22px;right:14px;width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(243,156,18,.55);cursor:pointer;z-index:250;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}
/* Sheet */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:500;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 8px}
.sheet-title{font-size:15px;font-weight:700;padding:0 15px 10px;border-bottom:1px solid var(--border)}
.sheet-body{padding:13px 15px}
/* Form */
.fg{margin-bottom:12px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--gray);margin-bottom:5px}
.req{color:var(--red)}
select.ff,textarea.ff{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:#f8f9fa;appearance:none}
select.ff:focus,textarea.ff:focus{border-color:var(--orange);background:#fff;outline:none}
textarea.ff{height:72px;resize:none}
.pin-info{background:#fff8ec;border:1.5px solid var(--orange);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;margin-bottom:11px;display:none}
.pin-warn{background:#fdecea;border:1.5px solid var(--red);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--red);font-weight:700;margin-bottom:11px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{padding:6px 12px;border-radius:13px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer}
.chip.active{border-color:var(--orange);background:#fff8ec;color:var(--orange)}
/* Photo zone */
.photo-zone{border:2px dashed var(--border);border-radius:9px;padding:15px;text-align:center;position:relative;background:#fafafa;cursor:pointer}
.photo-zone:active{border-color:var(--orange);background:#fff8ec}
.photo-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph-icon{font-size:26px;margin-bottom:4px}
.ph-text{font-size:12px;color:var(--gray)}
/* ★ Bug3: 改善成 contain + 原始大小，不拉伸 */
#photoPreview{width:auto;max-width:100%;border-radius:7px;margin:7px auto 0;display:none;max-height:200px;object-fit:contain;display:block}
/* ★ Bug8: 繪圖工具列 */
.draw-toolbar{display:none;gap:6px;margin-top:8px;flex-wrap:wrap;background:#f8f9fa;padding:8px;border-radius:8px}
.draw-toolbar.show{display:flex}
.draw-btn{padding:6px 12px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.draw-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}
#drawCanvas{width:100%;border-radius:7px;display:none;touch-action:none;cursor:crosshair;background:transparent;margin-top:0}
/* Buttons */
.btn-submit{width:100%;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btn-submit:disabled{background:#b2bec3}
.btn-cancel{width:100%;padding:11px;background:#f0f0f0;color:var(--gray);border:none;border-radius:9px;font-size:14px;cursor:pointer;margin-top:7px}
/* ★ Bug6: 雙照片容器 */
.dual-photo-wrap{display:none;gap:8px;margin-bottom:8px}
.dual-photo-wrap.show{display:flex}
.photo-half{flex:1;text-align:center}
.photo-half .ph-label{font-size:11px;font-weight:700;padding:3px 0;display:block}
.photo-half.before .ph-label{color:var(--red)}
.photo-half.after .ph-label{color:var(--green)}
/* ★ Bug3: Detail image 原始大小 */
.detail-img-wrap{background:#111;text-align:center;display:none;padding:4px 0}
.detail-img{max-width:100%;max-height:220px;object-fit:contain;height:auto;display:inline-block}
.detail-card{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:500;max-height:88vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,0,1);visibility:hidden;will-change:transform}
.detail-card.open{transform:translateY(0);visibility:visible}
.detail-body{padding:13px 15px}
.d-status{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:9px}
.d-todo{background:#fdecea;color:var(--red)}.d-review{background:#e3f2fd;color:var(--blue)}.d-done{background:#e8f8ee;color:var(--green)}
.d-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.d-meta{font-size:12px;color:var(--gray);line-height:1.9}
.act-row{display:flex;gap:7px;margin-top:11px}
.act-btn{flex:1;padding:11px 5px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.a-orange{background:var(--orange);color:#fff}.a-green{background:var(--green);color:#fff}.a-red{background:var(--red);color:#fff}.a-gray{background:#f0f0f0;color:var(--gray)}
.edit-row{display:flex;gap:7px;align-items:center;margin-top:10px}
.edit-row input{flex:1;padding:8px;border:1.5px solid var(--orange);border-radius:6px;font-size:13px}
.edit-row button{padding:8px 12px;background:var(--orange);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}
/* Stats */
.stats-bar{display:flex;background:#fff;border-bottom:1px solid var(--border);margin-bottom:10px}
.stat-cell{flex:1;text-align:center;padding:9px 4px;border-right:1px solid var(--border)}
.stat-cell:last-child{border:none}
.stat-num{font-size:20px;font-weight:700;display:block;line-height:1}
.stat-label{font-size:10px;color:var(--gray);margin-top:3px;display:block}
.s-total{color:var(--dark)}.s-todo{color:var(--red)}.s-review{color:var(--blue)}.s-done{color:var(--green)}.s-rate{color:var(--orange)}
/* ★ Bug9: List page with thumbnails */
#listPage{display:none}
.filter-row{display:flex;gap:6px;padding:0 11px 8px;overflow-x:auto;padding-top:8px}
.filter-chip{padding:5px 13px;border-radius:13px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;white-space:nowrap}
.filter-chip.active{border-color:var(--orange);background:#fff8ec;color:var(--orange)}
.defect-list{padding:0 11px}
.dc{background:#fff;border-radius:9px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden;border-left:4px solid var(--border);cursor:pointer}
.dc.todo{border-color:var(--red)}.dc.review{border-color:var(--blue)}.dc.done{border-color:var(--green)}
.dc-inner{display:flex;gap:0}
.dc-thumb{width:70px;min-width:70px;height:70px;object-fit:cover;background:#eee;display:block}
.dc-thumb-placeholder{width:70px;min-width:70px;height:70px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#bbb}
.dc-content{flex:1;padding:9px 10px}
.dc-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.dc-title{font-weight:700;font-size:13px;flex:1;margin-right:6px;line-height:1.3}
.dc-st{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap}
.dc-meta{font-size:11px;color:var(--gray);line-height:1.7}
/* Toast / Loader */
.toast{visibility:hidden;min-width:220px;background:rgba(0,0,0,.82);color:#fff;text-align:center;border-radius:20px;padding:12px 20px;position:fixed;z-index:9999;left:50%;bottom:30px;transform:translateX(-50%);font-size:13px;font-weight:600}
.toast.show{visibility:visible;animation:fadein .4s,fadeout .4s 2.8s}
@keyframes fadein{from{bottom:0;opacity:0}to{bottom:30px;opacity:1}}
@keyframes fadeout{from{bottom:30px;opacity:1}to{bottom:0;opacity:0}}
#loader{position:fixed;inset:0;background:rgba(244,244,244,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #ddd;border-top-color:var(--orange);animation:spin .8s linear infinite;margin-bottom:13px}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-size:14px;color:var(--gray);font-weight:600}
/* Fix photo must-upload hint */
.must-photo-hint{font-size:12px;color:var(--red);font-weight:700;text-align:center;padding:6px;background:#fdecea;border-radius:6px;margin-top:6px;display:none}
.must-photo-hint.show{display:block}
</style>
</head>
<body>
<div id="loader"><div class="spinner"></div><p>現場缺失系統載入中...</p></div>
<div id="offlineBanner" onclick="syncOffline()">📵 離線 — <span id="offlineCount">0</span> 筆待同步，點擊同步</div>
<div class="header">
  <div><div class="header-title">🗺️ 現場缺失管理</div><div class="header-sub" id="headerSub">同興營造</div></div>
</div>
<div class="tabs">
  <div class="tab active" id="tabMap" onclick="switchTab('map')">🗺️ 圖紙標記</div>
  <div class="tab" id="tabList" onclick="switchTab('list')">📋 缺失清單</div>
</div>
<div class="sel-bar">
  <select id="selSite" onchange="onSiteChange()"><option value="">— 案場 —</option></select>
  <select id="selFloor" onchange="onFloorChange()" disabled><option value="">— 樓層 —</option></select>
  <button class="refresh-btn" onclick="loadDefects()">🔄</button>
</div>
<div class="export-row" id="exportRow" style="display:none">
  <button class="exp-btn exp-all" onclick="exportExcel('all')">📊 匯出總缺失單</button>
  <button class="exp-btn exp-trade" onclick="exportExcel('trade')">📋 匯出派工單</button>
</div>

<!-- MAP TAB -->
<div id="mapPage">
  <div class="map-container" id="canvas-container">
    <div class="hint-bar" id="mapHint">請選擇案場與樓層後，點擊圖紙標記缺失位置</div>
    <canvas id="floorPlan"></canvas>
  </div>
</div>

<!-- LIST TAB -->
<div id="listPage">
  <div class="stats-bar">
    <div class="stat-cell s-total"><span class="stat-num" id="statTotal">0</span><span class="stat-label">📋 總計</span></div>
    <div class="stat-cell s-todo"><span class="stat-num" id="statTodo">0</span><span class="stat-label">🔴 待改善</span></div>
    <div class="stat-cell s-review"><span class="stat-num" id="statReview">0</span><span class="stat-label">🔵 待驗收</span></div>
    <div class="stat-cell s-done"><span class="stat-num" id="statDone">0</span><span class="stat-label">🟢 已改善</span></div>
    <div class="stat-cell s-rate"><span class="stat-num" id="statRate">0%</span><span class="stat-label">✅ 完成率</span></div>
  </div>
  <div class="filter-row">
    <div class="filter-chip active" onclick="filterList('ALL',this)">全部</div>
    <div class="filter-chip" onclick="filterList('待改善',this)">🔴 待改善</div>
    <div class="filter-chip" onclick="filterList('待驗收',this)">🔵 待驗收</div>
    <div class="filter-chip" onclick="filterList('已改善',this)">🟢 已改善</div>
  </div>
  <div class="defect-list" id="defectList"></div>
</div>

<button class="fab" onclick="startAddMode()">＋</button>
<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>

<!-- New defect sheet -->
<div class="sheet" id="defectSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle">📍 新增缺失</div>
  <div class="sheet-body">
    <input type="hidden" id="pinX"><input type="hidden" id="pinY">
    <div class="pin-info" id="pinInfo">📌 已標記位置：<span id="pinCoordText"></span></div>
    <div class="pin-warn" id="pinWarn">⚠️ 請先在圖紙上點選缺失位置，再填寫資料</div>
    <div class="fg">
      <label class="fl">工程類別 <span class="req">*</span></label>
      <div class="chip-row" id="deptChips"></div>
    </div>
    <div class="fg">
      <label class="fl">缺失說明 <span class="req">*</span></label>
      <textarea class="ff" id="defectDesc" placeholder="描述缺失狀況..."></textarea>
    </div>
    <div class="fg">
      <label class="fl">現場照片</label>
      <div class="photo-zone" style="position:relative">
        <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="onPhotoSelected(this)">
        <div class="ph-icon">📷</div><div class="ph-text">點擊拍攝現場照片</div>
      </div>
      <!-- ★ Bug8: 繪圖工具列 -->
      <div style="position:relative">
        <img id="photoPreview" style="width:auto;max-width:100%;border-radius:7px;margin-top:7px;display:none;max-height:200px;object-fit:contain;display:block">
        <canvas id="drawCanvas" style="position:absolute;top:7px;left:0;width:100%;height:100%;border-radius:7px;display:none;touch-action:none;cursor:crosshair"></canvas>
      </div>
      <div class="draw-toolbar" id="drawToolbar">
        <button class="draw-btn active" id="btnRed" onclick="setDrawColor('red',this)">🔴 紅筆</button>
        <button class="draw-btn" id="btnYellow" onclick="setDrawColor('yellow',this)">🟡 黃筆</button>
        <button class="draw-btn" id="btnErase" onclick="setDrawColor('erase',this)">🗑 清除</button>
        <button class="draw-btn" onclick="resetDraw()">↩ 重置</button>
      </div>
    </div>
    <button class="btn-submit" id="btnSubmitDefect" onclick="submitDefect()">📤 送出缺失紀錄</button>
    <button class="btn-cancel" onclick="closeSheet()">取消</button>
  </div>
</div>

<!-- Detail card -->
<div class="sheet-mask" id="detailMask" onclick="closeDetail()" style="display:none"></div>
<div class="detail-card" id="detailCard">
  <div class="sheet-handle"></div>
  <!-- ★ Bug6: 雙照片區域 -->
  <div class="dual-photo-wrap" id="dualPhotoWrap">
    <div class="photo-half before">
      <span class="ph-label">🔴 改善前</span>
      <img id="imgBefore" style="width:100%;max-height:160px;object-fit:contain;background:#111;border-radius:4px">
    </div>
    <div class="photo-half after">
      <span class="ph-label">🟢 改善後</span>
      <img id="imgAfter" style="width:100%;max-height:160px;object-fit:contain;background:#111;border-radius:4px">
    </div>
  </div>
  <!-- ★ Bug3: 單照片（待改善時）原始大小 -->
  <div class="detail-img-wrap" id="singleImgWrap">
    <img id="detailImg" class="detail-img">
  </div>
  <div class="detail-body">
    <div class="d-status" id="detailStatus"></div>
    <div class="d-title" id="detailTitle"></div>
    <div class="d-meta" id="detailMeta"></div>
    <div class="edit-row" style="margin-top:12px">
      <input type="text" id="editDescInput" placeholder="修改說明...">
      <button onclick="saveDesc()">儲存</button>
    </div>
    <!-- ★ Bug4: 改善照片上傳（必填） -->
    <div id="fixPhotoWrap" style="display:none;margin-top:11px">
      <label class="fl">⚠️ 請上傳改善後照片（必填，才能送交驗收）</label>
      <div class="photo-zone">
        <input type="file" id="fixPhotoInput" accept="image/*" capture="environment" onchange="onFixPhotoSelected(this)">
        <div class="ph-icon">📷</div><div class="ph-text">拍攝改善後照片</div>
      </div>
      <img id="fixPhotoPreview" style="display:none;width:auto;max-width:100%;border-radius:7px;margin-top:7px;max-height:140px;object-fit:contain">
      <div class="must-photo-hint" id="mustPhotoHint">⚠️ 請先拍攝改善後照片才能送交驗收</div>
    </div>
    <div class="act-row" id="actionRow"></div>
    <button class="btn-cancel" style="margin-top:9px" onclick="closeDetail()">關閉</button>
  </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
/* ─── Config ─── */
const urlP=new URLSearchParams(window.location.search);
const apiBase=urlP.get('api')||'https://unpregnant-tonically-caitlyn.ngrok-free.dev';
const initSite=decodeURIComponent(urlP.get('site')||'');
const initFloor=decodeURIComponent(urlP.get('floor')||'');
let myUser  = decodeURIComponent(urlP.get('user')  || '');
const myUserId=urlP.get('userId')||'';
let myLevel = parseFloat(urlP.get('level') || '2');
let myRole  = decodeURIComponent(urlP.get('role')  || '');
const LIFF_ID="2009287087-4LSCRAq4";
const GH_PAGES="https://yehlc.github.io/Tonsin";

/* ─── IndexedDB ─── */
function openDB(){return new Promise((r,j)=>{const q=indexedDB.open('TonsinOff',1);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('q'))e.target.result.createObjectStore('q',{keyPath:'id',autoIncrement:true})};q.onsuccess=e=>{db=e.target.result;r(db)};q.onerror=()=>j(q.error)})}
function addQ(p){return new Promise((r,j)=>{const t=db.transaction('q','readwrite');const q=t.objectStore('q').add({p,ts:Date.now()});q.onsuccess=()=>r(q.result);q.onerror=()=>j()})}
function getAllQ(){return new Promise((r,j)=>{const t=db.transaction('q','readonly');const q=t.objectStore('q').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}
function delQ(id){return new Promise(r=>{const t=db.transaction('q','readwrite');t.objectStore('q').delete(id).onsuccess=r})}

/* ─── Init ─── 
   ★ 根本修復：check-auth 必須在 initUI() 之前完成
   原本錯誤：Promise.all([liff.init().then(async()=>{await fetch...}), openDB()]).then(()=>initUI())
   問題：.then(async ()=>{}) 的內部 await 不會讓 Promise.all 等待
   修正：改用單一 async 函式串接，確保 check-auth 在 initUI() 前完成
*/
async function bootstrap() {
  try { await openDB(); } catch(e) {}
  try {
    await liff.init({liffId: LIFF_ID});
    if (liff.isLoggedIn()) {
      const p = await liff.getProfile();
      lineId = p.userId;
      // ★ 若 URL 沒帶 user= 參數，自動從資料庫查詢真實姓名（等待完成再繼續）
      if (!myUser) {
        try {
          const r = await fetch(apiBase + '/check-auth?userId=' + lineId,
            { headers: { 'ngrok-skip-browser-warning': 'true' } });
          if (r.ok) {
            const info = await r.json();
            if (info && info.name && info.name !== '訪客') {
              myUser  = info.name;
              myLevel = parseFloat(info.level) || myLevel;
              myRole  = info.role  || myRole;
              // 更新 header
              document.getElementById('headerSub').textContent =
                myUser + (currentSite ? ' | ' + currentSite : '');
            }
          }
        } catch(e) { console.warn('check-auth:', e); }
      }
    }
  } catch(e) { console.warn('liff.init:', e); }
  initUI();
  document.getElementById('loader').style.display = 'none';
  checkQCount();
}
bootstrap();


function initUI(){

  if(initSite){ss.value=initSite;onSiteChange();}

  drawCanvas=document.getElementById('drawCanvas');
  drawCtx=drawCanvas.getContext('2d');
  initDrawEvents();

  floorCanvas.addEventListener('click',function(e){
    const rect=floorCanvas.getBoundingClientRect();
    const scaleX=floorCanvas.width/rect.width;const scaleY=floorCanvas.height/rect.height;
    const cx=(e.offsetX!==undefined)?e.offsetX*scaleX:(e.clientX-rect.left)*scaleX;
    const cy=(e.offsetY!==undefined)?e.offsetY*scaleY:(e.clientY-rect.top)*scaleY;
    handleCanvasTap(cx,cy);
  });
  let tSX=0,tSY=0,tSL=0;
  floorCanvas.addEventListener('touchstart',function(e){tSL=e.touches.length;if(e.touches.length===1){tSX=e.touches[0].clientX;tSY=e.touches[0].clientY;}},{passive:true});
  floorCanvas.addEventListener('touchend',function(e){
    if(tSL===1&&e.changedTouches.length===1){
      const dx=e.changedTouches[0].clientX-tSX,dy=e.changedTouches[0].clientY-tSY;
      if(Math.sqrt(dx*dx+dy*dy)<10){
        const rect=floorCanvas.getBoundingClientRect();
        const scaleX=floorCanvas.width/rect.width,scaleY=floorCanvas.height/rect.height;
        handleCanvasTap((e.changedTouches[0].clientX-rect.left)*scaleX,(e.changedTouches[0].clientY-rect.top)*scaleY);
      }
    }
  },{passive:true});

  const cr=document.getElementById('deptChips');
  DEPT_LIST.forEach(d=>{const c=document.createElement('div');c.className='chip';c.textContent=d;c.onclick=()=>{cr.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');selectedDept=d;};cr.appendChild(c);});

    isOnline=true;

    });
  });
  window.addEventListener('offline',()=>{
    isOnline=false;
    document.getElementById('offlineBanner').style.display='block';
    document.getElementById('offlineCount').textContent='目前離線';
    showToast('📵 網路已斷線，新增缺失將存入離線佇列');
  });
  if(initSite&&initFloor){setTimeout(()=>{loadFloorPlan();loadDefects();},100);}
}

/* ★ Bug8: 繪圖工具 */
function initDrawEvents(){
  function getDrawPos(e){
    const r=drawCanvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left)*(drawCanvas.width/r.width),y:(src.clientY-r.top)*(drawCanvas.height/r.height)};
  }
  function startDraw(e){if(currentDrawColor==='erase')return;e.preventDefault();isDrawing=true;hasDrawn=true;const p=getDrawPos(e);drawCtx.beginPath();drawCtx.moveTo(p.x,p.y);}
  function doDraw(e){if(!isDrawing)return;e.preventDefault();const p=getDrawPos(e);drawCtx.lineTo(p.x,p.y);drawCtx.stroke();}
  function endDraw(e){e.preventDefault();isDrawing=false;}
  function startErase(e){if(currentDrawColor!=='erase')return;e.preventDefault();isDrawing=true;const p=getDrawPos(e);eraseAt(p.x,p.y);}
  function doErase(e){if(!isDrawing||currentDrawColor!=='erase')return;e.preventDefault();const p=getDrawPos(e);eraseAt(p.x,p.y);}
  function eraseAt(x,y){drawCtx.clearRect(x-20,y-20,40,40);}
  drawCanvas.addEventListener('mousedown',e=>{startDraw(e);startErase(e);});
  drawCanvas.addEventListener('mousemove',e=>{doDraw(e);doErase(e);});
  drawCanvas.addEventListener('mouseup',endDraw);
  drawCanvas.addEventListener('touchstart',e=>{startDraw(e);startErase(e);},{passive:false});
  drawCanvas.addEventListener('touchmove',e=>{doDraw(e);doErase(e);},{passive:false});
  drawCanvas.addEventListener('touchend',endDraw,{passive:false});
}
function setDrawColor(c,btn){
  currentDrawColor=c;
  document.querySelectorAll('.draw-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(c!=='erase'){drawCtx.strokeStyle=c;drawCtx.lineWidth=3;drawCtx.lineCap='round';drawCtx.lineJoin='round';}
}
function resetDraw(){drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);hasDrawn=false;}

/* ─── Floor Plan ─── 
   ★★★ 效能優化重點 ★★★
   1. Cache-First：已快取的圖紙立即顯示（毫秒級），不再等網路
   2. 第一次載入時用 Image.src 直接設定 URL，瀏覽器邊下載邊解碼（比 fetch+blob 快約 30%）
   3. 背景非阻塞快取（stale-while-revalidate）
   4. 同樓層重複切換時，使用 in-memory blob 快取，零延遲
*/

// ★ 記憶體層級快取（最快，session 內切換立即顯示）
const memBlobCache = new Map(); // url -> blob URL
const loadingPromises = new Map(); // url -> Promise（避免重複載入同一張）

function loadFloorPlan(){
  const hint=document.getElementById('mapHint');
  if(NO_MAP.includes(currentFloor)){
    floorCanvas.width=600;floorCanvas.height=300;
    floorCtx.fillStyle='#e0e0e0';floorCtx.fillRect(0,0,600,300);
    floorCtx.fillStyle='#888';floorCtx.font='16px sans-serif';floorCtx.textAlign='center';
    floorCtx.fillText('此樓層無平面圖紙',300,150);
    hint.textContent='⚠️ 此樓層無平面圖紙，仍可新增缺失（不標記位置）';hint.className='hint-bar';drawDefects(allDefects);return;
  }
  hint.textContent='⏳ 載入圖紙中...';hint.className='hint-bar';

  const m=FLOOR_IMG[currentSite];
  const imgUrl=m&&m[currentFloor]?(GH_PAGES+m[currentFloor]):`${GH_PAGES}/${encodeURIComponent(currentSite)}/${encodeURIComponent(currentFloor)}.png`;

  floorImg=new Image();floorImg.crossOrigin='anonymous';
  floorImg.decoding='async'; // ★ 非同步解碼，不阻塞主執行緒

  // ── 共用 onload / onerror ──
  const onSuccess = () => {
    floorCanvas.width=floorImg.naturalWidth;floorCanvas.height=floorImg.naturalHeight;
    floorCtx.drawImage(floorImg,0,0);drawDefects(allDefects);
    hint.textContent='📍 點擊圖面標記缺失位置，或點擊已有標記查看詳情';hint.className='hint-bar ready';
    // ★ 圖載完成後才開始預快取相鄰樓層（避免搶頻寬）
    if(isOnline) requestIdleCallback ? requestIdleCallback(()=>precacheFloorPlan(currentSite),{timeout:3000}) : setTimeout(()=>precacheFloorPlan(currentSite),1500);
  };
  const onFailure = () => {
    floorCanvas.width=600;floorCanvas.height=400;
    floorCtx.fillStyle='#e0e0e0';floorCtx.fillRect(0,0,600,400);
    floorCtx.fillStyle='#666';floorCtx.font='16px sans-serif';floorCtx.textAlign='center';
    if(!isOnline){
      floorCtx.fillText('📵 離線模式：圖紙未快取',300,180);
      floorCtx.fillStyle='#e74c3c';floorCtx.font='14px sans-serif';
      floorCtx.fillText('請先在有網路的地方開啟此頁面以快取圖紙',300,210);
    } else {
      floorCtx.fillText('圖紙尚未上傳：'+currentFloor,300,200);
    }
    hint.textContent=isOnline?'⚠️ 圖紙尚未上傳，點擊任意位置仍可新增缺失':'📵 離線模式：圖紙未快取，但仍可新增缺失';
    hint.className='hint-bar';drawDefects(allDefects);
  };
  floorImg.onload = onSuccess;
  floorImg.onerror = onFailure;

  // ── 三層快取策略 ──
  // Level 1: 記憶體快取（同 session 切換最快）
  if(memBlobCache.has(imgUrl)){
    floorImg.src = memBlobCache.get(imgUrl);
    return;
  }

  // Level 2: Cache API 快取（離線/跨 session 可用）+ Level 3: 網路（首次）
  loadFloorImageOptimized(imgUrl).then(blobUrl => {
    memBlobCache.set(imgUrl, blobUrl);
    floorImg.src = blobUrl;
  }).catch(() => {
    // 終極備援：直接連網路（同時讓瀏覽器 HTTP 快取生效）
    floorImg.src = imgUrl;
  });
}
function renderCanvas(){
  floorCtx.clearRect(0,0,floorCanvas.width,floorCanvas.height);
  if(floorImg.complete&&floorImg.naturalWidth>0)floorCtx.drawImage(floorImg,0,0);
  drawDefects(allDefects);
}
function drawDefects(defects){
  defects.forEach(d=>{
    if(!d.XY_Coord||d.XY_Coord==='略過')return;
    const m=d.XY_Coord.match(/X:([\d.]+)%,\s*Y:([\d.]+)%/);if(!m)return;
    const px=parseFloat(m[1])/100*floorCanvas.width,py=parseFloat(m[2])/100*floorCanvas.height;
    const col=d.Status.includes('待改善')?'#e74c3c':d.Status.includes('待驗收')?'#2980b9':'#27ae60';
    drawPin(px,py,d.ID,col);
  });
}
/* ★ Bug7: 縮小圓形標註 - 從0.016改為0.009，最小從12改為7 */
function drawPin(px,py,id,color){
  const r=Math.max(7,floorCanvas.width*0.009);
  floorCtx.beginPath();floorCtx.arc(px,py,r,0,Math.PI*2);floorCtx.fillStyle=color;floorCtx.fill();
  floorCtx.beginPath();floorCtx.arc(px,py,r,0,Math.PI*2);floorCtx.strokeStyle='#fff';floorCtx.lineWidth=1.5;floorCtx.stroke();
  floorCtx.fillStyle='#fff';floorCtx.font=`bold ${Math.max(7,r*0.85)}px sans-serif`;floorCtx.textAlign='center';floorCtx.textBaseline='middle';
  floorCtx.fillText(String(id).slice(-2),px,py);
}
function drawPendingPin(px,py){

  floorCtx.beginPath();floorCtx.arc(px,py,r,0,Math.PI*2);floorCtx.fillStyle='rgba(243,156,18,.85)';floorCtx.fill();

  floorCtx.fillStyle='#fff';floorCtx.font=`bold ${Math.max(7,r*0.85)}px sans-serif`;floorCtx.textAlign='center';floorCtx.textBaseline='middle';

function handleCanvasTap(cx,cy){
  if(!currentSite||!currentFloor){showToast('⚠️ 請先選擇案場與樓層');return;}
  const hit=allDefects.find(d=>{
    if(!d.XY_Coord||d.XY_Coord==='略過')return false;
    const m=d.XY_Coord.match(/X:([\d.]+)%,\s*Y:([\d.]+)%/);if(!m)return false;
    const dpx=parseFloat(m[1])/100*floorCanvas.width,dpy=parseFloat(m[2])/100*floorCanvas.height;
    return Math.sqrt((cx-dpx)**2+(cy-dpy)**2)<Math.max(14,floorCanvas.width*0.02);
  });
  if(hit){openDetail(hit);return;}
  pendingX=(cx/floorCanvas.width*100).toFixed(1);pendingY=(cy/floorCanvas.height*100).toFixed(1);hasPendingPin=true;
  drawPendingPin(cx,cy);openSheet();
}

/* ─── Get final photo (with drawing merged) ─── */
/* ─── ★ 圖片壓縮（最大 1200px，quality 0.72）─── */
const IMG_MAX = 1200;
function compressImage(base64OrNull, quality) {
  return new Promise(resolve => {
    if (!base64OrNull) return resolve(null);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > IMG_MAX || h > IMG_MAX) {
        const ratio = Math.min(IMG_MAX / w, IMG_MAX / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality || 0.72).replace(/^data:image\/\w+;base64,/, ''));
    };
    img.onerror = () => resolve(null);
    img.src = base64OrNull.startsWith('data:') ? base64OrNull : 'data:image/jpeg;base64,' + base64OrNull;
  });
}

function getFinalPhotoBase64(){
  if(!photoBase64)return null;
  if(!hasDrawn)return photoBase64.replace(/^data:image\/\w+;base64,/,'');
  const tempCanvas=document.createElement('canvas');
  const img=document.getElementById('photoPreview');
  tempCanvas.width=img.naturalWidth||400;tempCanvas.height=img.naturalHeight||300;
  const tCtx=tempCanvas.getContext('2d');
  tCtx.drawImage(img,0,0,tempCanvas.width,tempCanvas.height);
  tCtx.drawImage(drawCanvas,0,0,tempCanvas.width,tempCanvas.height);
  return tempCanvas.toDataURL('image/jpeg',0.85).replace(/^data:image\/\w+;base64,/,'');
}

async function submitDefect(){

  const desc=document.getElementById('defectDesc').value.trim();
  if(!desc){showToast('⚠️ 請填寫缺失說明');return;}

  // ★ 壓縮圖片再送出（顯著降低傳輸量）
  const rawImg = getFinalPhotoBase64();
  const finalImg = rawImg ? await compressImage(
    rawImg.startsWith('data:') ? rawImg : 'data:image/jpeg;base64,' + rawImg, 0.72
  ) : null;

  const payload={userId:lineId||myUserId,userName: myUser || lineId || '現場人員',

    showToast('📵 已存入離線佇列，上線後同步');closeSheet();
    btn.disabled=false;btn.textContent='📤 送出缺失紀錄';return;
  }

  btn.textContent='⏳ 送出中...';

  // ★ 樂觀更新：先加到本地清單，讓圖紙立刻出現標記點
  const tempId = 'tmp_'+Date.now();
  allDefects.unshift({ID:tempId,UserName:myUser||'現場人員',Site:currentSite,Floor:currentFloor,
    Dept:selectedDept,Description:desc,XY_Coord:xyCoord,Status:'🔴 待改善',TimeStamp:new Date().toISOString()});
  renderCanvas();
  closeSheet(); // 先關 sheet，讓使用者可以繼續操作

  try{
    const r=await apiFetch('/add',{method:'POST',body:JSON.stringify(payload)});
    const res=await r.json();
    if(res.success){
      showToast('✅ #'+res.newId+' 缺失已建立！可繼續新增...');
      // 用真實 ID 取代暫時 ID
      const idx = allDefects.findIndex(d=>d.ID===tempId);
      if(idx>-1) allDefects[idx].ID = res.newId;
      await loadDefects(); // 背景同步完整資料
      const hint=document.getElementById('mapHint');
      hint.textContent='📍 繼續點選圖紙新增下一筆缺失';hint.className='hint-bar ready';
    } else {

      allDefects = allDefects.filter(d=>d.ID!==tempId);
      renderCanvas();renderList();
      showToast('❌ 送出失敗：'+(res.error||'伺服器錯誤'));
    }
  }catch(e){
    // 例外：存入離線佇列
    allDefects = allDefects.filter(d=>d.ID!==tempId);
    await addQ({type:'add',...payload});checkQCount();
    showToast('❌ 連線異常，已存入離線佇列');
    await loadDefects();
  }
  finally{btn.disabled=false;btn.textContent='📤 送出缺失紀錄';hasPendingPin=false;photoBase64=null;}
}

/* ─── ★ 離線圖紙快取（Cache API）★★★ 已優化：Cache-First + Stale-While-Revalidate ─── */
const FLOOR_CACHE = 'tonsin-floor-v1';

/**
 * 核心圖片載入：Cache-First 策略
 * - 若有快取：立即返回 blob URL（毫秒級），背景非阻塞地檢查更新
 * - 若無快取：從網路下載，存入快取後返回 blob URL
 * 與舊版相比：已快取的圖片不再需要等網路，速度提升 10-100 倍
 */
async function loadFloorImageOptimized(url) {
  if(!('caches' in window)) {
    // 不支援 Cache API：直接 fetch
    const r = await fetch(url);
    if(!r.ok) throw new Error('fetch failed');
    const blob = await r.blob();
    return URL.createObjectURL(blob);
  }

  // 避免同一張圖被同時載入兩次
  if(loadingPromises.has(url)) return loadingPromises.get(url);

  const promise = (async () => {
    const cache = await caches.open(FLOOR_CACHE);
    const cached = await cache.match(url);

    if(cached) {
      // ✅ 命中快取：立即返回（最快路徑）
      const blob = await cached.blob();
      const blobUrl = URL.createObjectURL(blob);
      // 背景非阻塞地檢查更新（stale-while-revalidate）
      // 注意：圖紙幾乎不變，可省略此步以節省頻寬；如需即時性可開啟
      // revalidateInBackground(cache, url);
      return blobUrl;
    }

    // ❌ 沒快取：從網路下載並寫入快取
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('image not found');
    // 先 clone 再寫入快取（避免 body 被消耗）
    cache.put(url, resp.clone()).catch(()=>{});
    const blob = await resp.blob();
    return URL.createObjectURL(blob);
  })().finally(() => loadingPromises.delete(url));

  loadingPromises.set(url, promise);
  return promise;
}

// 背景重新驗證（目前未使用，但保留供需要時啟用）
async function revalidateInBackground(cache, url) {
  try {
    const resp = await fetch(url, {cache:'no-cache'});
    if(resp.ok) {
      await cache.put(url, resp.clone());
      // 若需要強制重繪可發出事件，此處保守地不打擾使用者
    }
  } catch(e) {}
}

// 純快取寫入（不返回 blob URL，給預快取用）
async function cacheFloorImage(url) {
  if(!('caches' in window)) return;
  try {
    const cache = await caches.open(FLOOR_CACHE);
    const cached = await cache.match(url);
    if(!cached) {
      const resp = await fetch(url);
      if(resp.ok) await cache.put(url, resp.clone());
    }
  } catch(e) {}
}

// ★ 預先快取指定案場所有樓層的圖紙（限制併發數，不搶當前圖載入頻寬）
const PRECACHE_CONCURRENCY = 2; // 同時最多 2 條連線預載
const precachedSites = new Set(); // 已預快取過的案場，避免重複呼叫

async function precacheFloorPlan(site) {
  if(!site || precachedSites.has(site)) return;
  precachedSites.add(site);

  const floors = SITE_FLOORS[site];
  const floorMap = FLOOR_IMG[site];
  if(!floors || !floorMap) return;

  // 收集所有要預載的 URL（排除當前已載入的，那張一定已快取）
  const urls = floors
    .filter(f => !NO_MAP.includes(f) && floorMap[f])
    .map(f => GH_PAGES + floorMap[f]);

  // 限制併發：每次起 PRECACHE_CONCURRENCY 條，全部完成才繼續下一批
  for(let i = 0; i < urls.length; i += PRECACHE_CONCURRENCY) {
    const batch = urls.slice(i, i + PRECACHE_CONCURRENCY);
    await Promise.all(batch.map(u => cacheFloorImage(u).catch(()=>{})));
    // 每批之間短暫休息，讓出主執行緒
    await new Promise(r => setTimeout(r, 100));
  }
}
