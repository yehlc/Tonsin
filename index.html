  ========================================================= -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同興營造 — 系統路由中</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; margin:0; background:#f4f6f9; font-family:'Noto Sans TC','PingFang TC',sans-serif; }
    .logo { font-size:36px; margin-bottom:16px; }
    .company { font-size:16px; font-weight:700; color:#2d3436; margin-bottom:6px; }
    .sub { font-size:13px; color:#636e72; margin-bottom:24px; }
    .loader { width:36px; height:36px; border-radius:50%; border:4px solid #ddd; border-top-color:#00b894; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .err { color:#e74c3c; font-size:13px; margin-top:16px; display:none; text-align:center; padding:0 20px; }
  </style>
</head>
<body>
  <div class="logo">🏗️</div>
  <div class="company">同興營造</div>
  <div class="sub">數位工務管理系統</div>
  <div class="loader"></div>
  <div class="err" id="errMsg"></div>

  <script>
    const LIFF_ID = "2009287087-4LSCRAq4";

    liff.init({ liffId: LIFF_ID }).then(() => {
      const q  = new URLSearchParams(window.location.search);
      const pg = q.get('page') || '';

      const routes = {
        'inspection': 'liff-inspection.html',
        'hse':        'liff-hse.html',        // ★ 新增
        'purchase':   'liff-purchase.html',   // ★ 新增
        'task':       'liff-task.html',
        'floorplan':  'liff-floorplan.html'
      };

      // Default fallback → floorplan
      const target = routes[pg] || 'liff-floorplan.html';
      window.location.replace(target + window.location.search);

    }).catch(err => {
      document.getElementById('errMsg').style.display = 'block';
      document.getElementById('errMsg').textContent = '⚠️ 系統初始化失敗，請重新開啟：' + err.message;
      // Fallback after 2s
      setTimeout(() => window.location.replace('liff-floorplan.html' + window.location.search), 2000);
    });
  </script>
</body>
</html>

// ─── 3. 廠商評分 ─────────────────────────────────────────────────
app.post('/purchase/rate-contractor', async (req, res) => {
    try {
        let pool = await sql.connect(dbConfig);
        const { requestId, rater, quality, schedule, hse, comm, comment } = req.body;
        const avg = ((quality + schedule + hse + comm) / 4).toFixed(2);
        await pool.request()
            .input('reqId', sql.NVarChar, requestId)
            .input('rater', sql.NVarChar, rater)
            .input('quality',  sql.Float, quality  || 0)
            .input('schedule', sql.Float, schedule || 0)
            .input('hse',      sql.Float, hse      || 0)
            .input('comm',     sql.Float, comm     || 0)
            .input('avg',      sql.Float, parseFloat(avg))
            .input('comment',  sql.NVarChar, comment || '')
            .query(`INSERT INTO ContractorRatings (RequestID, Rater, QualityScore, ScheduleScore, HSEScore, CommScore, AvgScore, Comment, CreatedAt)
                    VALUES (@reqId, @rater, @quality, @schedule, @hse, @comm, @avg, @comment, GETDATE())`);
        res.json({ success: true });
    } catch (err) { res.status(500).json({ success: false, error: err.message }); }
});

app.post('/hse/patrol-record', async (req, res) => {

            .input('area',       sql.NVarChar, area || '')
            .input('result',     sql.NVarChar, result)
            .input('desc',       sql.NVarChar, description)
            .input('photo',      sql.VarBinary(sql.MAX), photoBuffer)
            .input('inspector',  sql.NVarChar, inspector)
            .input('inspId',     sql.NVarChar, inspectorId)
            .input('ptime',      sql.DateTime, new Date(patrolTime))
            .query(`INSERT INTO PatrolRecords (SiteName, PatrolArea, Result, Description, PhotoData, Inspector, InspectorID, PatrolTime)
                    VALUES (@site, @area, @result, @desc, @photo, @inspector, @inspId, @ptime)`);

        // Notify director if abnormal
        if (result === 'ng') {
            const dRes = await pool.request().input('site', sql.NVarChar, site)
                .query(`SELECT u.UserID FROM Users u JOIN SitePermissions sp ON u.UserID = sp.UserID
                        WHERE (sp.SiteName = @site OR sp.SiteName = 'ALL') AND u.Level >= 3
                        ORDER BY u.Level DESC`);
            for (const row of dRes.recordset.slice(0, 2)) {
                await axios.post('https://api.line.me/v2/bot/message/push', {
                    to: row.UserID,
                    messages: [{ type: 'text', text: `⚠️ 【工安巡邏異常】\n案場：${site}\n區域：${area}\n異常：${description}\n巡邏人：${inspector}` }]
                }, { headers: { Authorization: `Bearer ${LINE_TOKEN}` } }).catch(() => {});
            }
        }
        res.json({ success: true });
    } catch (err) { res.status(500).json({ success: false, error: err.message }); }
});
