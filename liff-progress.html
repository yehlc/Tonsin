<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>進度管制表</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--p:#1A6FA8;--g:#1D7C4D;--o:#e17055;--y:#f39c12;--pur:#8e44ad;--bg:#f0f4f8;--bd:#ddd;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'PingFang TC','Noto Sans TC',sans-serif;background:var(--bg);min-height:100vh;}
.header{background:var(--p);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:100;}
.header h1{font-size:16px;font-weight:700;}
.header p{font-size:11px;opacity:.8;margin-top:2px;}
.controls{background:#fff;padding:10px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:8px;}
.controls select{padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:14px;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.chip{padding:5px 12px;border-radius:16px;font-size:12px;border:1px solid var(--bd);cursor:pointer;white-space:nowrap;background:#fff;color:#555;flex-shrink:0;}
.chip.active{background:var(--p);color:#fff;border-color:var(--p);}
.legend{display:flex;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid #eee;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#555;}
.leg-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
/* Matrix table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;white-space:nowrap;font-size:12px;}
th,td{border:1px solid #ddd;padding:5px 6px;text-align:center;min-width:38px;}
.col-item{min-width:120px;max-width:160px;text-align:left;white-space:normal;word-break:break-all;
           position:sticky;left:0;z-index:10;background:#fff;}
.col-item.hd{background:var(--p);color:#fff;z-index:20;}
th.fl-hd{background:#f0f4f8;color:#333;font-weight:600;font-size:11px;}
.item-name{font-weight:600;color:#1A2F4B;font-size:12px;}
.item-sub{font-size:10px;color:#888;margin-top:1px;}
.item-vendor{font-size:10px;color:var(--p);}
.s-done{background:#d4edda;color:#155724;border-radius:4px;font-size:10px;font-weight:600;padding:2px 4px;}
.s-draw{background:#fff3cd;color:#856404;border-radius:4px;font-size:10px;font-weight:600;padding:2px 4px;}
.s-send{background:#cfe2ff;color:#084298;border-radius:4px;font-size:10px;font-weight:600;padding:2px 4px;}
.s-work{background:#e2d9f3;color:#4a235a;border-radius:4px;font-size:10px;font-weight:600;padding:2px 4px;}
.s-empty{color:#ccc;font-size:10px;}
.cat-施工進度{background:#e2d9f3;}
.cat-送審進度{background:#cfe2ff;}
.cat-發包{background:#fff3cd;}
.row-sub td.col-item{background:#f8fafc;padding-left:18px;font-size:11px;color:#666;}
#globalLoader{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:999;font-size:24px;}
</style>
</head>

<div id="globalLoader">⏳</div>
<div class="header">

  <p id="sheetLabel"></p>
</div>

<div class="controls">
  <select id="siteSelect" onchange="onSiteChange()">

  <div class="chips" id="catChips">

    <div class="chip" onclick="setCat('施工進度',this)">🏗 施工進度</div>
    <div class="chip" onclick="setCat('送審進度',this)">📋 送審進度</div>
    <div class="chip" onclick="setCat('發包',this)">📑 發包項目</div>

</div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#d4edda;border:1px solid #1D7C4D;"></div>完成</div>
  <div class="leg-item"><div class="leg-dot" style="background:#fff3cd;border:1px solid #f39c12;"></div>審圖中</div>
  <div class="leg-item"><div class="leg-dot" style="background:#cfe2ff;border:1px solid #084298;"></div>送審中</div>
  <div class="leg-item"><div class="leg-dot" style="background:#e2d9f3;border:1px solid #8e44ad;"></div>施工中</div>
  <div class="leg-item"><div class="leg-dot" style="background:#f8d7da;border:1px solid #721c24;"></div>未完成</div>
</div>

<div class="table-wrap" id="tableWrap">
  <div style="text-align:center;padding:40px;color:#888;">請選擇案場</div>
</div>

let curSite = '', curCat = '全部', siteData = null;

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn() && liff.isInClient()) {
    liff.login({ redirectUri: window.location.href }); return;
  }
  document.getElementById('globalLoader').style.display = 'none';
  initSiteSelect();
  const initSite = decodeURIComponent(urlP.get('site') || '');
  if (initSite) {
    document.getElementById('siteSelect').value = initSite;
    onSiteChange();
  }
}).catch(() => { document.getElementById('globalLoader').style.display = 'none'; initSiteSelect(); });

function initSiteSelect() {
  const sel = document.getElementById('siteSelect');
  PRESET_DATA.forEach(d => {
    const o = document.createElement('option'); o.value = d.site; o.textContent = '📍 ' + d.site; sel.appendChild(o);
  });
}

function onSiteChange() {
  curSite = document.getElementById('siteSelect').value;
  siteData = PRESET_DATA.find(d => d.site === curSite);
  if (!siteData) { document.getElementById('tableWrap').innerHTML = '<div style="text-align:center;padding:40px;color:#888;">請選擇案場</div>'; return; }
  document.getElementById('sheetLabel').textContent = '資料日期：' + siteData.latestSheet.replace(/^(\d{4})(\d{2})(\d{2})/, '$1/$2/$3');
  renderTable();
}

function setCat(cat, el) {
  curCat = cat;
  document.querySelectorAll('#catChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function getStatusClass(s) {
  if (!s) return 's-empty';
  if (s === '完成') return 's-done';
  if (s.includes('審圖')) return 's-draw';
  if (s.includes('送審')) return 's-send';
  if (s.includes('施工')) return 's-work';
  return 's-draw'; // 其他有值的狀態
}

function getStatusLabel(s) {
  if (!s) return '—';
  if (s === '完成') return '✓';
  if (s.includes('審圖')) return '審';
  if (s.includes('送審')) return '送';
  if (s.includes('施工')) return '施';
  if (s.includes('剩') || s.includes('未完成')) return '⚠';
  return s.substring(0, 2);
}

function renderTable() {
  if (!siteData) return;
  const floors = siteData.floors;

  // 篩選項目
  let items = siteData.items;
  if (curCat !== '全部') {
    items = items.filter(it => {
      if (curCat === '發包') return it.mainType.includes('發包');
      return it.mainType === curCat;
    });
  }

  if (!items.length) {
    document.getElementById('tableWrap').innerHTML = '<div style="text-align:center;padding:40px;color:#888;">此分類無資料</div>';
    return;
  }

  let html = '<table><thead><tr>';
  html += '<th class="col-item hd">項目</th>';
  floors.forEach(f => html += `<th class="fl-hd">${f}</th>`);
  html += '</tr></thead><tbody>';

  items.forEach(item => {
    const mainType = item.mainType;
    const isPackage = mainType.includes('發包');
    let rowCls = '';
    if (mainType === '施工進度') rowCls = 'cat-施工進度';
    else if (mainType.includes('送審')) rowCls = 'cat-送審進度';
    else if (isPackage) rowCls = 'cat-發包';

    // 主行
    html += `<tr class="${rowCls}">`;
    html += `<td class="col-item ${rowCls}">
      <div class="item-name">${item.name}</div>
      <div class="item-sub">${mainType}</div>
      ${item.vendor ? `<div class="item-vendor">🏭 ${item.vendor}</div>` : ''}
    </td>`;
    const mainRow = item.rows[0];
    floors.forEach(f => {
      const s = (mainRow.statuses[f] || '').trim();
      const cls = getStatusClass(s);
      html += `<td title="${s || '未開始'}"><span class="${cls}">${getStatusLabel(s)}</span></td>`;
    });
    html += '</tr>';

    // 子行（送審/進場 等）
    if (isPackage && item.rows.length > 1) {
      item.rows.slice(1).forEach(subRow => {
        html += `<tr class="row-sub">`;
        html += `<td class="col-item"><span style="color:#888;font-size:11px;">└ ${subRow.subType}</span></td>`;
        floors.forEach(f => {
          const s = (subRow.statuses[f] || '').trim();
          const cls = getStatusClass(s);
          html += `<td title="${s || ''}" style="background:#fafafa;"><span class="${cls}">${getStatusLabel(s)}</span></td>`;
        });
        html += '</tr>';
      });
    }
  });

  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;
}
</script>
