<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>附件檢視</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'PingFang TC','Noto Sans TC',sans-serif;background:#f4f6f9;min-height:100vh;
     display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.icon{font-size:48px;margin-bottom:12px;}
.msg{font-size:14px;color:#636e72;margin-bottom:20px;text-align:center;word-break:break-all;max-width:320px;}
.error{color:#e74c3c;}
img{max-width:100%;max-height:85vh;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);}
iframe{width:100vw;height:85vh;border:none;}
.dl-btn{display:inline-block;padding:12px 28px;background:#00b894;color:#fff;
        border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;
        box-shadow:0 4px 10px rgba(0,184,148,.35);}
.dl-btn:active{filter:brightness(.9);}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid #ddd;
         border-top-color:#00b894;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="icon" id="icon">📎</div>
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">載入附件中...</div>
<div id="content"></div>

<script>
const p   = new URLSearchParams(window.location.search);
const id  = p.get('id');
const api = p.get('api') || 'https://unpregnant-tonically-caitlyn.ngrok-free.dev';

if (!id) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('msg').className = 'msg error';
  document.getElementById('msg').textContent = '⚠️ 缺少附件 ID';
} else {
  fetch(api + '/attachment/' + id, {
    headers: {
      'ngrok-skip-browser-warning': 'true',
      'Cache-Control': 'no-cache'
    }
  })
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const ct = r.headers.get('Content-Type') || 'application/octet-stream';
    const cd = r.headers.get('Content-Disposition') || '';
    let fn = '';
    const fnMatch = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
    if (fnMatch) fn = decodeURIComponent(fnMatch[1]);
    return r.blob().then(blob => ({ blob, ct, fn }));
  })
  .then(({ blob, ct, fn }) => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = fn || '附件';
    const url = URL.createObjectURL(blob);
    const c   = document.getElementById('content');

    if (ct.startsWith('image/')) {
      // 圖片直接顯示
      document.getElementById('icon').textContent = '🖼️';
      c.innerHTML = `<img src="${url}" alt="${fn}" onerror="this.style.display='none'">`;
    } else if (ct === 'application/pdf') {
      // PDF 用 iframe 預覽
      document.getElementById('icon').style.display = 'none';
      document.getElementById('msg').style.display  = 'none';
      c.innerHTML = `<iframe src="${url}"></iframe>`;
    } else {
      // 其他檔案 → 下載按鈕
      document.getElementById('icon').textContent = '📄';
      c.innerHTML = `<a class="dl-btn" href="${url}" download="${fn}">⬇️ 下載 ${fn||'附件'}</a>`;
    }
  })
  .catch(e => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('icon').textContent = '❌';
    document.getElementById('msg').className = 'msg error';
    document.getElementById('msg').textContent = '載入失敗：' + e.message;
  });
}
</script>
</body>
</html>
