<!DOCTYPE html>
<html lang="zh-TW">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>同興營造 — 發包作業</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --primary:#00b894;--accent:#fdcb6e;--danger:#e17055;
  --text:#2d3436;--muted:#636e72;--bg:#f4f6f9;--card:#fff;--border:#dfe6e9;
  --shadow:0 2px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
.header{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,184,148,.4)}
.header-title{font-size:17px;font-weight:700}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:54px;z-index:100}
.tab{flex:1;text-align:center;padding:13px 4px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.tab.active{color:var(--primary);border-color:var(--primary)}
.page{display:none;padding:14px}.page.active{display:block}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-header{background:var(--primary);color:#fff;padding:12px 16px;font-weight:700;font-size:14px}
.card-body{padding:14px}
.fg{margin-bottom:13px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fl span{color:var(--danger)}
select,textarea,input[type=text],input[type=date]{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;background:#f8f9fa;color:var(--text);appearance:none;transition:border .2s}
select:focus,textarea:focus,input:focus{border-color:var(--primary);outline:none;background:#fff}
textarea{height:90px;resize:vertical}
.sel-wrap{position:relative}.sel-wrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.valid-hint{font-size:12px;margin-top:4px;display:none}
.valid-hint.error{color:var(--danger);display:block}
.file-zone{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;position:relative;background:#fafbfc;transition:.2s}
.file-zone:hover,.file-zone.drag{border-color:var(--primary);background:#e8f8f5}
.file-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fzi{font-size:28px;margin-bottom:4px}.fzt{font-size:13px;color:var(--muted)}
.file-list{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.file-chip{display:flex;align-items:center;gap:8px;background:#e8f8f5;border:1px solid var(--primary);border-radius:6px;padding:6px 10px;font-size:13px}
.file-chip .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-chip .fsize{color:var(--muted);font-size:11px}
.file-chip .remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px;padding:0}
.btn-submit{width:100%;padding:15px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,184,148,.4);margin-top:6px;transition:.2s}
.btn-submit:disabled{background:#b2bec3;box-shadow:none}
.pr-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.pr-card-header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.pr-card-title{font-weight:700;font-size:14px;flex:1;margin-right:8px}
.pr-status-badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
.st-pending{background:#fff3cd;color:#856404}
.st-approved{background:#d4edda;color:#155724}
.st-rejected{background:#f8d7da;color:#721c24}
.pr-card-body{padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.7}
.pr-chain{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.chain-node{font-size:12px;padding:3px 8px;border-radius:12px;font-weight:600}
.chain-done{background:#d4edda;color:#155724}
.chain-current{background:#fff3cd;color:#856404}
.chain-future{background:#f1f1f1;color:#aaa}
.chain-arrow{color:#aaa;font-size:12px}
.filter-row{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.filter-chip{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.2s}
.filter-chip.active{border-color:var(--primary);background:#e8f8f5;color:var(--primary)}
.star-row{display:flex;gap:8px;margin:8px 0}
.star{font-size:26px;cursor:pointer;opacity:.3;transition:.15s}.star.lit{opacity:1}
.photo-zone{border:2px dashed var(--border);border-radius:9px;padding:15px;text-align:center;position:relative;background:#fafafa;cursor:pointer}
.photo-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(0,0,0,.82);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:600;z-index:9999;transition:transform .28s;white-space:pre-line;text-align:center;pointer-events:none;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#globalLoader{position:fixed;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #ddd;border-top-color:var(--primary);animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
#globalLoader p{font-size:14px;color:var(--muted);font-weight:600}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state .icon{font-size:44px;margin-bottom:10px}

/* Log history */
.log-entry{background:#f8f9fa;border-radius:7px;padding:9px 12px;margin-bottom:6px;font-size:12px;border-left:3px solid var(--primary)}
.log-entry .log-action{font-weight:700;color:var(--text)}
.log-entry .log-meta{color:var(--muted);margin-top:2px}

/* ═══ 發包總覽手風琴 ═══ */
.acc-wrap{padding:10px 10px 30px;}
.acc-cat{background:#fff;border-radius:10px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.08);overflow:hidden;}
.acc-cat-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;background:linear-gradient(135deg,#1A6FA8,#2980b9);}
.acc-cat-hd:active{filter:brightness(.94);}
.acc-arr{font-size:10px;color:rgba(255,255,255,.85);transition:transform .22s;flex-shrink:0;}
.acc-arr.open{transform:rotate(90deg);}
.acc-cat-name{flex:1;font-size:14px;font-weight:700;color:#fff;}
.acc-cat-cnt{font-size:11px;background:rgba(255,255,255,.22);color:#fff;padding:2px 9px;border-radius:10px;white-space:nowrap;}
.acc-cat-bd{display:none;}
.acc-sub{border-top:1px solid #eef2f5;}
.acc-sub-hd{display:flex;align-items:center;gap:8px;padding:10px 14px 10px 28px;cursor:pointer;background:#f8fafc;}
.acc-sub-hd:active{background:#edf3fb;}
.acc-sub-arr{font-size:9px;color:#636e72;transition:transform .18s;flex-shrink:0;}
.acc-sub-arr.open{transform:rotate(90deg);}
.acc-sub-name{flex:1;font-size:13px;font-weight:600;color:#2d3436;}
.acc-sub-cnt{font-size:11px;color:#888;background:#e9ecef;padding:1px 7px;border-radius:8px;white-space:nowrap;}
.acc-sub-bd{display:none;background:#fff;}
.acc-item{display:flex;align-items:center;gap:6px;padding:9px 12px 9px 44px;border-top:1px solid #f0f2f5;}
.acc-item:active{background:#f8f9fa;}
.acc-item-name{flex:1;font-size:12px;color:#2d3436;line-height:1.3;}
.acc-ibadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;}
.ib-none{background:#e9ecef;color:#636e72;}
.ib-pend{background:#fff3cd;color:#856404;}
.ib-ok  {background:#d4edda;color:#155724;}
.ib-rej {background:#f8d7da;color:#721c24;}
.acc-new-btn {font-size:11px;padding:3px 9px;border:none;border-radius:6px;cursor:pointer;background:#00b894;color:#fff;white-space:nowrap;flex-shrink:0;}
.acc-view-btn{font-size:11px;padding:3px 9px;border:1.5px solid #1A6FA8;border-radius:6px;cursor:pointer;background:#fff;color:#1A6FA8;white-space:nowrap;flex-shrink:0;}
.acc-edit-btn{font-size:11px;padding:3px 9px;border:none;border-radius:6px;cursor:pointer;background:#e17055;color:#fff;white-space:nowrap;flex-shrink:0;}

</style>
</head>
<body>
<div id="globalLoader"><div class="spinner"></div><p>系統載入中...</p></div>

<div class="header">
  <div class="header-title">📑 工程發包作業</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('new')">➕ 新增請簽</div>
  <div class="tab" onclick="switchTab('track')">📊 追蹤查詢</div>
  <div class="tab" onclick="switchTab('status')">📋 發包總覽</div>
</div>

<!-- Tab 1: 新增請簽 -->
<div class="page active" id="page-new">
  <div class="card">
    <div class="card-header">📋 填寫發包請簽單</div>
    <div class="card-body">
      <div class="fg"><label class="fl">案場<span>*</span></label><div class="sel-wrap"><select id="prSite" onchange="onSiteChange()"><option value="">— 請選擇案場 —</option></select></div></div>
      <div class="fg"><label class="fl">工程大項<span>*</span></label><div class="sel-wrap"><select id="prCat" onchange="onCatChange()" disabled><option value="">— 請先選擇案場 —</option></select></div></div>
      <div class="fg"><label class="fl">中項分類<span>*</span></label><div class="sel-wrap"><select id="prSub" onchange="onSubChange()" disabled><option value="">— 請先選擇大項 —</option></select></div></div>
      <div class="fg"><label class="fl">工程細項<span>*</span></label><div class="sel-wrap"><select id="prItem" onchange="onItemChange()" disabled><option value="">— 請先選擇中項 —</option></select></div></div>
      <div class="fg"><label class="fl">規格/數量/備註<span>*</span></label><textarea id="prDetails" placeholder="例：室內地磚 60×60cm，約50坪，含材料費及施工費"></textarea><div class="valid-hint" id="validHint"></div></div>
      <div class="fg">
        <label class="fl">附件（圖面、估價單）</label>
        <div class="file-zone" id="fileZone"><input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls,.doc,.docx" onchange="handleFiles(this.files)"><div class="fzi">📎</div><div class="fzt">點擊或拖拉上傳（最多5個）</div></div>
        <div class="file-list" id="fileList"></div>
      </div>
      <button class="btn-submit" id="btnSubmit" onclick="submitPR()">📤 送出請簽申請</button>
    </div>
  </div>
</div>

<!-- Tab 2: 追蹤查詢 -->
<div class="page" id="page-track">
  <div class="filter-row">
    <div class="filter-chip active" onclick="filterStatus('ALL',this)">全部</div>
    <div class="filter-chip" onclick="filterStatus('PENDING',this)">審核中</div>
    <div class="filter-chip" onclick="filterStatus('APPROVED',this)">已發包</div>
    <div class="filter-chip" onclick="filterStatus('REJECTED',this)">已退回</div>
  </div>
  <div id="prList"><div class="empty-state"><div class="icon">📭</div><p>載入中...</p></div></div>
</div>

<!-- ★ PR 詳情/審核面板（Slide-up） -->
<div id="prReviewMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;" onclick="closePRReview()"></div>
<div id="prReviewPanel" style="
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-radius:16px 16px 0 0;
  max-height:90vh;overflow-y:auto;z-index:201;
  transform:translateY(100%);transition:transform .3s ease;
  padding:0 0 30px;">
  <!-- 標題列 -->
  <div style="position:sticky;top:0;background:#1A6FA8;padding:14px 16px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center;">
    <span id="reviewPanelTitle" style="color:#fff;font-weight:700;font-size:16px;">📑 發包詳情</span>
    <button onclick="closePRReview()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;">✕</button>
  </div>
  <!-- 內容區 -->
  <div id="prReviewContent" style="padding:14px 16px;">載入中...</div>
  <!-- 審核按鈕（有核准權才顯示） -->
  <div id="prReviewActions" style="display:none;padding:0 16px 16px;display:flex;gap:10px;flex-direction:column;">
    <button onclick="doReviewAction('APPROVE')" id="btnPRApprove" style="
      padding:13px;border:none;border-radius:10px;
      background:#1D7C4D;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;">
      ✅ 核准此發包請簽
    </button>
    <button onclick="doReviewAction('REJECT')" style="
      padding:13px;border:none;border-radius:10px;
      background:#e74c3c;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;">
      ❌ 退回並要求修改
    </button>
  </div>
</div>

<!-- Tab 4: 發包狀態總覽 -->
<div class="page" id="page-status">
  <!-- 工地 + 視圖切換 -->
  <div style="padding:10px 10px 0;display:flex;gap:8px;align-items:center;">
    <select id="statusSiteFilter" onchange="loadStatusOverview()" style="flex:1;padding:9px;border:1px solid #ddd;border-radius:8px;font-size:14px;color:#333;">
    </select>

  </div>
  <!-- 統計列 -->
  <div id="statusSummary" style="display:flex;gap:8px;padding:10px 10px 0;flex-wrap:wrap;"></div>

  <!-- 工程項目全覽（手風琴，預設視圖）-->
  <div id="treeView" style="padding:0;"></div>
</div>

<div id="toast"></div>

function validateDetails(item, text) {
  const hint = document.getElementById('validHint');
  hint.className = 'valid-hint';
  if (!item||!text) return;
  for (const key of Object.keys(VALIDATION_RULES)) {
    if (item.indexOf(key) > -1) {
      const rule = VALIDATION_RULES[key];
      const ok = rule.kw.some(k => text.indexOf(k) > -1);
      hint.textContent = ok ? '' : rule.msg;
      hint.className = 'valid-hint'+(ok?'':' error');
      return;
    }
  }
  if (text.length > 5) { hint.textContent='✓ 格式看起來正確'; hint.className='valid-hint'; }
}

// 送出請簽
async function submitPR() {
  const site=document.getElementById('prSite').value, cat=document.getElementById('prCat').value;
  const sub=document.getElementById('prSub').value, item=document.getElementById('prItem').value;
  const details=document.getElementById('prDetails').value.trim();
  if (!site||!cat||!sub||!item||!details) { showToast('⚠️ 請填寫所有必填欄位'); return; }

  const btn = document.getElementById('btnSubmit');
  const isEditMode = btn.dataset.editMode === 'true';
  const editPrId   = btn.dataset.editPrId  || '';

  btn.disabled=true; btn.textContent='⏳ 送出中...';
  try {
    const payload = isEditMode
      ? { action:'resubmit', requestNo:editPrId, details, applicant:myUser, applicantId:lineUserId||myUserId }
      : { action:'create', site, applicant:myUser, applicantId:lineUserId||myUserId,
          applicantRole:myRole, category:cat, subCat:sub, item, details };

    const r = await apiFetch('/pr-action', { method:'POST', body: JSON.stringify(payload) });
    const res = await r.json();
    if (!res.success) throw new Error(res.error||'送出失敗');

    // 附件上傳（新增模式才上傳）
    if (!isEditMode) {
      for (const file of uploadedFiles) {
        const b64 = await fileToBase64(file);
        await apiFetch('/upload-attachment', { method:'POST', body: JSON.stringify({
          requestNo:res.requestNo, fileName:file.name, fileType:file.type, fileBase64:b64, uploader:myUser
        })}).catch(()=>{});
      }
    }

    // ★ 附件全部上傳完後，呼叫後端發送含附件的完整 LINE 通知
    if (!isEditMode && res.requestNo) {
      apiFetch('/purchase/send-pr-notify', {
        method: 'POST',
        body: JSON.stringify({ requestNo: res.requestNo })
      }).catch(() => {}); // 非同步，失敗不影響主流程
    }

    // 重置 edit mode
    btn.dataset.editMode = '';
    btn.dataset.editPrId = '';
    document.getElementById('validHint').textContent = '';
    document.getElementById('validHint').className = 'valid-hint';

    showToast(isEditMode
      ? `✅ 已重新送出！`
      : `✅ 已送出！單號 ${res.requestNo}\n📨 通知 ${res.nextStageUser||res.nextStageName} 審核中`);
    ['prSite','prCat','prSub','prItem'].forEach(id=>{ document.getElementById(id).value=''; });
    ['prCat','prSub','prItem'].forEach(id=>{ document.getElementById(id).disabled=true; });
    document.getElementById('prDetails').value='';
    document.getElementById('fileList').innerHTML='';
    uploadedFiles=[];
    loadMyPRs();
  } catch(e) { showToast('❌ '+e.message); }
  finally { btn.disabled=false; btn.textContent=isEditMode?'🔄 重新送出申請':'📤 送出請簽申請'; }
}

function renderPRList() {
  const el=document.getElementById('prList');
  const filtered=currentStatusFilter==='ALL'?myPRs:myPRs.filter(p=>p.Status===currentStatusFilter);
  if (!filtered.length) { el.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>目前沒有記錄</p></div>'; return; }
  el.innerHTML=filtered.map(pr => {
    const stMap={'PENDING':{cls:'st-pending',txt:'審核中'},'APPROVED':{cls:'st-approved',txt:'已發包'},'REJECTED':{cls:'st-rejected',txt:'已退回'}};
    const s=stMap[pr.Status]||{cls:'st-pending',txt:pr.Status};
    const isElec=pr.Category==='水電空調工程';
    const chainStages=getChainStages(isElec);
    const curStage=parseFloat(pr.CurrentStage||3), isDone=pr.Status==='APPROVED';
    const chainHtml=chainStages.map(st => {
      let cls='chain-future', icon='○';
      if (isDone||st.level<curStage){cls='chain-done';icon='✓';}
      else if (st.level===curStage){cls='chain-current';icon='⧖';}
      return `<span class="chain-node ${cls}">${icon} ${st.name}</span>`;
    }).join('<span class="chain-arrow">›</span>');
    return `<div class="pr-card" onclick="openPRReview('${pr.RequestID}')" style="cursor:pointer;">
      <div class="pr-card-header"><div class="pr-card-title">${pr.ItemName}</div><div class="pr-status-badge ${s.cls}">${s.txt}</div></div>
      <div class="pr-card-body">
        <div>📍 ${pr.SiteName} | 📅 ${pr.CreatedAt?(pr.CreatedAt+'').substring(0,10):'-'}</div>
        <div style="margin-top:4px;color:var(--text)">📄 ${pr.Details||'無備註'}</div>
        ${pr.RejectReason?`<div style="margin-top:4px;color:var(--danger)">🛑 退回理由：${pr.RejectReason}</div>`:''}
        <div class="pr-chain">${chainHtml}</div>
      </div>
    </div>`;
  }).join('');
}

    }).join('<span class="chain-arrow">›</span>');

        <div style="display:flex;gap:8px;"><span style="color:#888;width:60px;">🔧 分類</span><span>${pr.Category} / ${pr.SubCat}</span></div>

        <div style="display:flex;gap:8px;"><span style="color:#888;width:60px;">👤 申請</span><span>${pr.ApplicantName||'-'}</span></div>
        <div style="display:flex;gap:8px;"><span style="color:#888;width:60px;">📅 日期</span><span>${(pr.CreatedAt||'').substring(0,10)}</span></div>

  try {
    const r = await apiFetch('/pr-action', {
      method: 'POST',
      body: JSON.stringify({
        action: 'review',
        requestNo: currentReviewPrId,
        status: action === 'APPROVE' ? 'APPROVE' : 'REJECTED',
        reviewer: myUser,
        reviewerRole: myRole,
        rejectReason: reason || ''

// ★ 手風琴展開/收合
function toggleAcc(hd) {
  const bd   = hd.nextElementSibling;
  const arr  = hd.querySelector('.acc-arr, .acc-sub-arr');
  const open = bd.style.display !== 'none';
  bd.style.display = open ? 'none' : 'block';

function buildPRTree() {
  const container = document.getElementById('treeView');
  if (!container) return;
  const siteSel = document.getElementById('statusSiteFilter');
  const site = siteSel ? siteSel.value : 'ALL';

  // 建立 prMap：key = Cat|Sub|Item → 最新 PR
  const prMap = {};
  allStatusPRs.forEach(pr => {
    if (site !== 'ALL' && pr.SiteName !== site) return;
    const key = `${pr.Category}|${pr.SubCat}|${pr.ItemName}`;
    if (!prMap[key] || (pr.CreatedAt||'') > (prMap[key].CreatedAt||'')) prMap[key] = pr;
  });

  let html = '<div class="acc-wrap">';

  Object.entries(PR_TREE).forEach(([cat, subs]) => {
    let catTotal = 0, catActive = 0;
    Object.entries(subs).forEach(([sub, items]) => {
      items.forEach(item => {
        catTotal++;
        if (prMap[`${cat}|${sub}|${item}`]) catActive++;
      });
    });
    const catPct = catTotal > 0 ? Math.round(catActive/catTotal*100) : 0;

    html += `<div class="acc-cat">
      <div class="acc-cat-hd" onclick="toggleAcc(this)">
        <span class="acc-arr">▶</span>
        <span class="acc-cat-name">${cat}</span>
        <span class="acc-cat-cnt">${catActive}/${catTotal} (${catPct}%)</span>
      </div>
      <div class="acc-cat-bd">`;

    Object.entries(subs).forEach(([sub, items]) => {
      const subActive = items.filter(item => prMap[`${cat}|${sub}|${item}`]).length;

      html += `<div class="acc-sub">
          <div class="acc-sub-hd" onclick="toggleAcc(this)">
            <span class="acc-sub-arr">▶</span>
            <span class="acc-sub-name">${sub}</span>
            <span class="acc-sub-cnt">${subActive}/${items.length}</span>
          </div>
          <div class="acc-sub-bd">`;

      items.forEach(item => {
        const key = `${cat}|${sub}|${item}`;
        const pr  = prMap[key];
        let badgeCls = 'ib-none', badgeTxt = '未發包', actionBtn = '';

        if (pr) {
          if      (pr.Status === 'PENDING')  { badgeCls='ib-pend'; badgeTxt='審核中'; }
          else if (pr.Status === 'APPROVED') { badgeCls='ib-ok';   badgeTxt='已發包'; }
          else if (pr.Status === 'REJECTED') { badgeCls='ib-rej';  badgeTxt='已退回'; }
          // ★ 非未發包 → 只能查看或重新提交（不能新增）
          if (pr.Status === 'REJECTED') {
            actionBtn = `<button class="acc-edit-btn" onclick="editPR('${pr.RequestID}')">🔄 重送</button>`;
          } else {
            actionBtn = `<button class="acc-view-btn" onclick="openPRReview('${pr.RequestID}')">查看</button>`;
          }
        } else {
          // 未發包 → 可新增請簽
          actionBtn = `<button class="acc-new-btn" onclick="prefillNewPR('${encodeURIComponent(cat)}','${encodeURIComponent(sub)}','${encodeURIComponent(item)}')">＋ 新增</button>`;
        }

        const dateStr = pr ? (pr.CreatedAt||'').substring(0,10) : '';
        html += `<div class="acc-item">
              <span class="acc-item-name">${item}${dateStr?`<br><span style="font-size:10px;color:#aaa;">${dateStr}</span>`:''}</span>
              <span class="acc-ibadge ${badgeCls}">${badgeTxt}</span>
              ${actionBtn}
            </div>`;
      });

      html += `</div></div>`; // close acc-sub-bd, acc-sub
    });

    html += `</div></div>`; // close acc-cat-bd, acc-cat
  });

  html += '</div>';
  container.innerHTML = html;
}

function prefillNewPR(catEnc, subEnc, itemEnc) {
  const cat  = decodeURIComponent(catEnc);
  const sub  = decodeURIComponent(subEnc);
  const item = decodeURIComponent(itemEnc);
  switchTab('new');
  setTimeout(() => {
    const catEl = document.getElementById('prCat');
    if (catEl) { catEl.value=cat; catEl.disabled=false; onCatChange(); }
    setTimeout(() => {
      const subEl = document.getElementById('prSub');
      if (subEl) { subEl.value=sub; subEl.disabled=false; onSubChange(); }
      setTimeout(() => {
        const itemEl = document.getElementById('prItem');
        if (itemEl) { itemEl.value=item; itemEl.disabled=false; }
        showToast(`📋 已預填：${item}`);
      }, 150);
    }, 150);
  }, 300);
}

function renderStatusSummary() {
  const siteSel = document.getElementById('statusSiteFilter');
  const curSite = siteSel ? siteSel.value : 'ALL';

  // 計算未發包數（用 PR_TREE 對比）
  const prKeys = new Set(allStatusPRs.map(p=>`${p.Category}|${p.SubCat}|${p.ItemName}`));
  let totalTree = 0;
  Object.values(PR_TREE).forEach(subs=>Object.values(subs).forEach(items=>totalTree+=items.length));
  const noneCount = totalTree - prKeys.size;

  const cards = [
    { label:'全部',   val:allStatusPRs.length, bg:'#1A6FA8', filter:'ALL'      },
    { label:'審核中', val:allStatusPRs.filter(p=>p.Status==='PENDING').length,  bg:'#ff9800', filter:'PENDING'  },
    { label:'已發包', val:allStatusPRs.filter(p=>p.Status==='APPROVED').length, bg:'#1D7C4D', filter:'APPROVED' },
    { label:'已退回', val:allStatusPRs.filter(p=>p.Status==='REJECTED').length, bg:'#e74c3c', filter:'REJECTED' },
    { label:'未發包', val:Math.max(0,noneCount), bg:'#888',   filter:'NONE'    }
  ];
  document.getElementById('statusSummary').innerHTML = cards.map(c=>
    `<div style="flex:1;min-width:55px;background:${c.bg};color:#fff;border-radius:10px;padding:10px 4px;text-align:center;">
      <div style="font-size:20px;font-weight:700;">${c.val}</div>
      <div style="font-size:10px;margin-top:2px;">${c.label}</div>
    </div>`
  ).join('');
}






// ★ apiFetch — 帶 timeout 和 ngrok bypass 的統一 fetch 函式
async function apiFetch(path, opts={}) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 10000); // 10s timeout
  try {
    const r = await fetch(apiBase + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true',
        ...(opts.headers || {})
      },
      signal: ctrl.signal
    });
    clearTimeout(tid);
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error(`HTTP ${r.status}${txt ? ': ' + txt.substring(0, 80) : ''}`);
    }
    return r;
  } catch(e) {
    clearTimeout(tid);
    if (e.name === 'AbortError') throw new Error('連線逾時，請確認 Node.js 服務已啟動');
    throw e;
  }
}

function fileToBase64(file) { return new Promise((r,j)=>{const rd=new FileReader();rd.readAsDataURL(file);rd.onload=()=>r(rd.result);rd.onerror=j;}); }
let _tt;
function showToast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),3500); }
