<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>驗屋圖面轉檔工具 v2 — 同興營造</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#1A2F4B;--rule:#d0d9e3;--bg:#f3f5f8;--card:#fff;--purple:#8e44ad;--green:#00b894;--orange:#e17055;}
html,body{background:var(--bg);font-family:'PingFang TC','Microsoft JhengHei',system-ui,sans-serif;color:var(--ink);}
header{background:var(--ink);padding:13px 22px;display:flex;align-items:center;gap:14px;}
header h1{color:#fff;font-size:15px;font-weight:800;}
.badge{background:var(--purple);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
main{max-width:1100px;margin:0 auto;padding:18px 20px 60px;}
.card{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:14px;}
.sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:'';width:3px;height:12px;background:var(--purple);border-radius:2px;}

/* top config */
.config-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.fld{flex:1;min-width:130px;}
.fld label{display:block;font-size:11px;font-weight:700;color:#888;margin-bottom:5px;}
.fld select,.fld input{width:100%;padding:8px 11px;border:1.5px solid var(--rule);border-radius:8px;font-size:13px;font-family:inherit;background:#fafbfc;}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--purple);}

/* drop zone */
.dz{border:2.5px dashed #c5cfd8;border-radius:12px;padding:28px;text-align:center;cursor:pointer;background:#fafbfc;transition:all .2s;}
.dz:hover,.dz.drag{border-color:var(--purple);background:#f8f4ff;}
.dz-icon{font-size:34px;margin-bottom:6px;}
.dz-t{font-size:14px;font-weight:700;}
.dz-s{font-size:12px;color:#888;margin-top:3px;}
#fi{display:none;}

/* file card */
.file-card{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.fc-head{padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafbfc;border-bottom:1px solid var(--rule);}
.fc-name{font-weight:800;font-size:13px;color:var(--ink);flex:1;min-width:180px;}
.fc-mini{display:flex;gap:6px;align-items:center;}
.fc-mini input{padding:5px 8px;border:1.5px solid var(--rule);border-radius:7px;font-size:12px;font-family:inherit;width:78px;}
.fc-mini input:focus{outline:none;border-color:var(--green);}
.fc-mini label{font-size:11px;color:#888;font-weight:700;}
.btn-sm{padding:5px 11px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-auto{background:var(--purple);color:#fff;}
.btn-gray{background:#e9ecef;color:var(--ink);}
.btn-danger{background:#fee2e2;color:#b91c1c;}
.btn-sm:active{filter:brightness(.9);}

/* page grid */
.fc-pages{padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;}
.pg-card{width:130px;flex-shrink:0;border:2px solid var(--rule);border-radius:9px;overflow:hidden;transition:border-color .15s;}
.pg-card.ok{border-color:var(--green);}
.pg-card.skip{opacity:.4;}
.pg-thumb{width:100%;aspect-ratio:1/1.414;background:#e8ecf0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
.pg-thumb canvas{max-width:100%;max-height:100%;object-fit:contain;}
.pg-num{position:absolute;top:4px;left:4px;background:rgba(26,47,75,.7);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;}
.pg-info{padding:6px 8px;}
.pg-sel{width:100%;padding:5px 6px;border:1.5px solid var(--rule);border-radius:6px;font-size:11px;font-family:inherit;background:#fafbfc;}
.pg-sel:focus{outline:none;border-color:var(--purple);}
.pg-sel.ok{border-color:var(--green);background:#f0fdf4;}
.pg-sel.skip{color:#aaa;}
.pg-dual{margin-top:4px;display:flex;align-items:center;gap:4px;font-size:10px;color:#555;}
.pg-dual input[type=checkbox]{accent-color:var(--orange);}

/* bottom bar */
.dl-bar{position:sticky;bottom:0;background:var(--ink);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:100;}
.btn-dl{padding:10px 22px;background:var(--green);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn-dl:disabled{background:#555;cursor:not-allowed;}
.dl-info{color:rgba(255,255,255,.7);font-size:12px;}
.dl-stat{color:#fff;font-size:12px;font-weight:700;}

/* toast */
.toast{position:fixed;bottom:70px;right:16px;background:#333;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:700;transform:translateY(40px);opacity:0;transition:all .3s;z-index:200;}
.toast.show{transform:none;opacity:1;}
</style>
</head>
<body>
<header>
  <h1>🏗️ 驗屋圖面轉檔工具 v2</h1>
  <span style="color:rgba(255,255,255,.5);font-size:12px;">自動解析檔名 · 位置判斷圖面種類 · 批次匯出</span>
  <span class="badge">同興營造</span>
</header>
<main>

<!-- Step 1 -->
<div class="card">
  <div class="sec-title">Step 1 &nbsp; 全域設定（所有檔案共用）</div>
  <div class="config-row">
    <div class="fld">
      <label>📍 案場</label>
      <select id="gSite" onchange="onSiteChange()">
        <option value="">— 請選擇 —</option>
        <option>98工地</option><option>99工地</option><option>95工地</option>
        <option selected>鼎隆大苑</option>
        <option>毅聯R8</option><option>毅聯寧夏</option>
        <option>廣宇江南</option><option>內湖富樂群</option><option>中壢映象</option>
      </select>
    </div>
    <div class="fld">
      <label>🖼️ 解析度</label>
      <select id="gDpi">
        <option value="1.5">快速（150 dpi）</option>
        <option value="2" selected>高品質（200 dpi，建議）</option>
        <option value="3">最高（300 dpi）</option>
      </select>
    </div>
    <div class="fld" style="max-width:320px;">
      <label>📐 此案場圖面種類</label>
      <div id="dtypeDisplay" style="font-size:12px;color:var(--purple);padding:9px 0;font-weight:700;"></div>
    </div>
  </div>
</div>

<!-- Step 2 -->
<div class="card">
  <div class="sec-title">Step 2 &nbsp; 拖放或選取 PDF（可一次多個）</div>
  <div class="dz" id="dz" onclick="document.getElementById('fi').click()">
    <div class="dz-icon">📂</div>
    <div class="dz-t">拖放多份 PDF 至此，或點擊選取</div>
    <div class="dz-s">例：3F-B5客變簽認.pdf、3F-B6客變簽認.pdf → 自動解析樓層戶別</div>
  </div>
  <input type="file" id="fi" accept=".pdf" multiple>
</div>

<!-- Step 3 -->
<div id="filesArea" style="display:none;">
  <div class="card" style="padding:12px 16px 10px;">
    <div class="sec-title" style="margin-bottom:8px;">Step 3 &nbsp; 確認並標記每份 PDF 的圖面種類</div>
    <div style="font-size:12px;color:#666;">
      ⚡ 系統已依<b>頁數規則</b>自動標記。請逐份確認，電力+燈具同頁時請勾「同存燈具圖」。
    </div>
  </div>
  <div id="fileList"></div>
</div>

</main>

<!-- Sticky download bar -->
<div class="dl-bar" id="dlBar" style="display:none;">
  <button class="btn-dl" id="btnDl" onclick="downloadAll()">⬇️ 下載全部 ZIP</button>
  <span class="dl-stat" id="dlStat"></span>
  <span class="dl-info">解壓後上傳至 GitHub：Tonsin / 驗屋圖資 / {案場} / {樓層} /</span>
</div>

<div class="toast" id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── 圖面設定 ────────────────────────────────────────────────
const DRAWING_CONFIG = {
  "98工地":  ["1.建築客變圖","2.電力插座圖","3.燈具開關圖","4.排水端點設備圖"],
  "鼎隆大苑":["1.建築客變圖","2.電力插座圖","3.燈具開關圖","4.排水端點設備圖"],
};
const DEFAULT_DT = ["1.建築客變圖","2.電氣端點設備圖","3.排水端點設備圖"];

// ── 頁數判斷規則 ─────────────────────────────────────────────
// 格式：{頁碼(1-based): 'arch'|'elec'|'drain'|'skip'}
const PAGE_RULES = {
  5: {1:'skip',2:'skip',3:'arch',4:'drain',5:'elec'},
  8: {1:'skip',2:'skip',3:'skip',4:'skip',5:'skip',6:'arch',7:'drain',8:'elec'},
  9: {1:'skip',2:'skip',3:'arch',4:'elec',5:'drain',6:'skip',7:'skip',8:'skip',9:'skip'},
  // 未列的頁數：預設跳過前2頁，其餘按順序指定
};

function resolveCode(code, dtypes) {
  if (code === 'skip' || !code) return 'skip';
  if (code === 'arch')  return dtypes[0];
  if (code === 'drain') return dtypes[dtypes.length - 1];
  if (code === 'elec')  return dtypes.length >= 2 ? dtypes[1] : dtypes[1];
  return '';
}

function getDtypes() {
  return DRAWING_CONFIG[document.getElementById('gSite').value] || DEFAULT_DT;
}

function onSiteChange() {
  const dt = getDtypes();
  document.getElementById('dtypeDisplay').textContent = dt.join('　');
  // 重新自動指定所有已載入的 file group
  document.querySelectorAll('.file-card').forEach(fc => {
    const fid = fc.dataset.fid;
    autoAssignFile(fid);
  });
}
// 初始顯示
(function(){ document.getElementById('dtypeDisplay').textContent = getDtypes().join('　'); })();

// ── 檔名解析 ─────────────────────────────────────────────────
function parseFilename(fname) {
  const base = fname.replace(/\.pdf$/i,'').replace(/客變.*$/,'').replace(/簽認.*$/,'');
  // 嘗試 {floor}-{room} 格式，如 3F-B6、6F_A-A2
  let m = base.match(/^(\d+F(?:_[AB])?)[^A-Za-z0-9]*([A-Za-z]\d+)/i);
  if (m) return { floor: m[1], room: m[2] + '戶' };
  // 嘗試只有 floor
  m = base.match(/(\d+F(?:_[AB])?)/i);
  const rm = base.match(/([A-Za-z]\d+)/);
  if (m) return { floor: m[1], room: rm ? rm[1]+'戶' : '' };
  return { floor:'', room:'' };
}

// ── 全域 file data ────────────────────────────────────────────
let fileData = {}; // fid → { file, floor, room, pages:[{canvas, assignment, dualSave}] }
let fidCounter = 0;

// ── 拖放 ─────────────────────────────────────────────────────
const dz = document.getElementById('dz');
dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('drag');});
dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
dz.addEventListener('drop', e=>{e.preventDefault();dz.classList.remove('drag');addFiles([...e.dataTransfer.files].filter(f=>f.name.endsWith('.pdf')));});
document.getElementById('fi').addEventListener('change', e=>{addFiles([...e.target.files]);e.target.value='';});

async function addFiles(files) {
  if (!files.length) return;
  document.getElementById('filesArea').style.display = 'block';
  document.getElementById('dlBar').style.display = 'flex';
  for (const f of files) await loadFile(f);
  updateDlStat();
}

async function loadFile(file) {
  const fid = 'f' + (fidCounter++);
  const parsed = parseFilename(file.name);
  fileData[fid] = { file, floor: parsed.floor, room: parsed.room, pages: [] };

  // 建立 file card UI
  const card = document.createElement('div');
  card.className = 'file-card'; card.id = 'card-'+fid; card.dataset.fid = fid;
  card.innerHTML = `
    <div class="fc-head">
      <span class="fc-name">📄 ${file.name}</span>
      <div class="fc-mini">
        <label>樓層</label>
        <input type="text" id="floor-${fid}" value="${parsed.floor}" placeholder="如 3F" oninput="fileData['${fid}'].floor=this.value;updateDlStat();">
        <label>戶別</label>
        <input type="text" id="room-${fid}" value="${parsed.room}" placeholder="如 B6戶" oninput="fileData['${fid}'].room=this.value;updateDlStat();">
        <button class="btn-sm btn-auto" onclick="autoAssignFile('${fid}')">⚡ 自動</button>
        <button class="btn-sm btn-gray" onclick="removeFile('${fid}')">✕</button>
      </div>
    </div>
    <div class="fc-pages" id="pages-${fid}">
      <div style="padding:8px;color:#888;font-size:12px;">⏳ 載入中...</div>
    </div>`;
  document.getElementById('fileList').appendChild(card);

  // 渲染 PDF 頁面
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const scale = parseFloat(document.getElementById('gDpi').value);
  const pagesDiv = document.getElementById('pages-'+fid);
  pagesDiv.innerHTML = '';

  for (let i=1; i<=pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const vp = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    fileData[fid].pages.push({canvas, assignment:'', dualSave:false});

    const pidx = i - 1;
    const pgCard = document.createElement('div');
    pgCard.className = 'pg-card'; pgCard.id = `pg-${fid}-${pidx}`;
    pgCard.innerHTML = `
      <div class="pg-thumb">
        <canvas></canvas>
        <span class="pg-num">p${i}</span>
      </div>
      <div class="pg-info">
        <select class="pg-sel" id="sel-${fid}-${pidx}" onchange="onPageAssign('${fid}',${pidx},this.value)">
          <option value="">— 選擇 —</option>
          <option value="skip">⛔ 跳過</option>
          ${getDtypes().map(t=>`<option value="${t}">${t}</option>`).join('')}
        </select>
        <div class="pg-dual" id="dual-${fid}-${pidx}" style="display:none;">
          <input type="checkbox" id="cb-${fid}-${pidx}" onchange="fileData['${fid}'].pages[${pidx}].dualSave=this.checked;updateDlStat();">
          <label for="cb-${fid}-${pidx}">同存燈具開關圖</label>
        </div>
      </div>`;
    const tc = pgCard.querySelector('canvas');
    tc.width=canvas.width; tc.height=canvas.height;
    tc.getContext('2d').drawImage(canvas,0,0);
    pagesDiv.appendChild(pgCard);
  }
  autoAssignFile(fid);
}

function onPageAssign(fid, pidx, val) {
  fileData[fid].pages[pidx].assignment = val;
  const card = document.getElementById(`pg-${fid}-${pidx}`);
  const sel  = document.getElementById(`sel-${fid}-${pidx}`);
  const dual = document.getElementById(`dual-${fid}-${pidx}`);
  card.className = 'pg-card' + (val==='skip'?' skip':val?' ok':'');
  sel.className  = 'pg-sel' + (val==='skip'?' skip':val?' ok':'');
  // 顯示「同存燈具」選項：當站點有4種圖面，且此頁指定的是第2種（電力插座圖）
  const dt = getDtypes();
  const showDual = dt.length === 4 && val === dt[1];
  dual.style.display = showDual ? 'flex' : 'none';
  if (!showDual) { fileData[fid].pages[pidx].dualSave = false; document.getElementById(`cb-${fid}-${pidx}`).checked = false; }
  updateDlStat();
}

// ── 自動指定（按頁數規則）───────────────────────────────────
function autoAssignFile(fid) {
  const fd = fileData[fid];
  if (!fd) return;
  const total = fd.pages.length;
  const rules = PAGE_RULES[total] || buildDefaultRule(total);
  const dt = getDtypes();

  fd.pages.forEach((p, i) => {
    const code = rules[i+1] || 'skip';
    const val  = resolveCode(code, dt);
    const sel  = document.getElementById(`sel-${fid}-${i}`);
    if (sel) sel.value = val;
    onPageAssign(fid, i, val);
    // 若為4種圖且電力插座頁：自動勾選「同存燈具」
    if (dt.length === 4 && val === dt[1]) {
      fd.pages[i].dualSave = true;
      const cb = document.getElementById(`cb-${fid}-${i}`);
      if (cb) cb.checked = true;
    }
  });
  showToast(`⚡ ${fd.file.name} 自動標記完成`);
  updateDlStat();
}

function buildDefaultRule(total) {
  const r = {};
  const codes = ['arch','elec','drain'];
  let ci = 0;
  for (let i=1; i<=total; i++) r[i] = i<=2 ? 'skip' : (ci < codes.length ? codes[ci++] : 'skip');
  return r;
}

function removeFile(fid) {
  delete fileData[fid];
  const card = document.getElementById('card-'+fid);
  if (card) card.remove();
  updateDlStat();
}

// ── 下載 ZIP ─────────────────────────────────────────────────
function updateDlStat() {
  let total = 0, ready = 0;
  Object.values(fileData).forEach(fd => {
    fd.pages.forEach(p => {
      if (p.assignment && p.assignment !== 'skip') {
        total++;
        if (fd.floor && fd.room) ready++;
        if (p.dualSave) { total++; if (fd.floor && fd.room) ready++; }
      }
    });
  });
  document.getElementById('dlStat').textContent = `${ready} 張 PNG 準備就緒`;
  document.getElementById('btnDl').disabled = ready === 0;
}

async function downloadAll() {
  const site = document.getElementById('gSite').value;
  if (!site) { showToast('⚠️ 請先選擇案場'); return; }
  const dt = getDtypes();

  const btn = document.getElementById('btnDl');
  btn.disabled = true; btn.textContent = '⏳ 轉換中...';

  const zip = new JSZip();
  let count = 0;
  const errors = [];

  for (const [fid, fd] of Object.entries(fileData)) {
    if (!fd.floor || !fd.room) { errors.push(`${fd.file.name}：缺少樓層或戶別`); continue; }
    const folder = zip.folder('驗屋圖資').folder(site).folder(fd.floor);

    for (const p of fd.pages) {
      if (!p.assignment || p.assignment === 'skip') continue;
      const blob = await new Promise(r => p.canvas.toBlob(r,'image/png'));
      folder.file(`${fd.room}_${p.assignment}.png`, blob);
      count++;
      // 同時存燈具開關圖
      if (p.dualSave && dt.length === 4) {
        const blob2 = await new Promise(r => p.canvas.toBlob(r,'image/png'));
        folder.file(`${fd.room}_${dt[2]}.png`, blob2); // dt[2] = 燈具開關圖
        count++;
      }
    }
  }

  if (errors.length) { showToast('⚠️ ' + errors.join(' / ')); }
  if (count === 0) { btn.disabled=false; btn.textContent='⬇️ 下載全部 ZIP'; return; }

  btn.textContent = '📦 打包中...';
  const content = await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  a.download = `驗屋圖資_${site}_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'')}.zip`;
  a.click();
  btn.disabled=false; btn.textContent='⬇️ 下載全部 ZIP';
  showToast(`✅ 完成！共 ${count} 張 PNG`);
  updateDlStat();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
